name: Run cumulative migration v3

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/run-cumulative-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate migration script
        run: node --check scripts/migrate-cumulative-v3.js

      - name: Apply migration
        run: node scripts/migrate-cumulative-v3.js

      - name: Validate implementation
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-giants-map.js
          node --check scripts/validate-cumulative-recipes.js
          node scripts/validate-cumulative-recipes.js
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/js/campaign-graph.js assets/js/campaign-map.js scripts/validate-cumulative-recipes.js .github/workflows/pages.yml
          git commit -m "Linearize intermediate stars and enforce cumulative recipes [skip ci]"
          git push
