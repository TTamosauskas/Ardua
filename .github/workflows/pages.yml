name: Run recipe polish migration

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply recipe and header polish
        run: node .github/scripts/recipe_polish.js

      - name: Validate JavaScript
        run: node --check assets/js/ardua.js

      - name: Validate diff
        run: git diff --check

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/css/ardua.css
          git commit -m "Polish phase recipes and cumulative reactions [skip ci]"
          git push

# retry after helper syntax correction
