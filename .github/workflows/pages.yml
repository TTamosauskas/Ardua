name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply stellar convection migration
        run: |
          sed -i 's/if count != 1:/if count < 1:/' .github/scripts/apply_stellar_convection.py
          sed -i "s/graph.count('stellar_convection') != 3/graph.count('stellar_convection') != 4/" .github/scripts/apply_stellar_convection.py
          python -m py_compile .github/scripts/apply_stellar_convection.py
          python .github/scripts/apply_stellar_convection.py
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-giants-map.js
          git diff --check

      - name: Commit convection system
        run: |
          git config user.name "Ardua Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/ardua.js assets/js/campaign-graph.js assets/js/campaign-giants-map.js assets/css/ardua.css
          git diff --cached --check
          git commit -m "Add stellar convection phase and mechanic"
          git push origin HEAD:main

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
