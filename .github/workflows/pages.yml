name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Apply campaign and particle refinements
        run: python .github/scripts/refine_convection_names_particles.py

      - name: Validate JavaScript and diff
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-map.js
          git diff --check

      - name: Commit production refinements
        run: |
          git config user.name "Ardua Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/ardua.js assets/js/campaign-map.js assets/css/ardua.css
          if ! git diff --cached --quiet; then
            git commit -m "Refine campaign names and stellar particles [skip ci]"
            git push
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
