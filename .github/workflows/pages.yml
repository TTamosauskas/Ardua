name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Apply astrophysical campaign forks
        run: python .github/scripts/apply_astrophysical_forks.py

      - name: Validate campaign JavaScript and diff
        run: |
          python -m py_compile .github/scripts/apply_astrophysical_forks.py
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-giants-map.js
          node --check assets/js/campaign-supergiants-map.js
          node --check assets/js/campaign-quasar-map.js
          git diff --check

      - name: Commit astrophysical campaign forks
        run: |
          git config user.name "Ardua Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/campaign-graph.js assets/js/campaign-map.js assets/css/campaign-map.css
          if ! git diff --cached --quiet; then
            git commit -m "Add astrophysical campaign forks [skip ci]"
            git push
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
