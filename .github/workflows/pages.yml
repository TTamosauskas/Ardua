name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check engine syntax
        run: node --check assets/js/ardua.js

      - name: Check rotation syntax
        run: node --check assets/js/rotation-polish.js

      - name: Validate element sources
        run: node scripts/validate-element-sources.mjs

      - name: Validate phenomenon sources
        run: node scripts/validate-phenomenon-sources.mjs

      - name: Validate phenomena discoveries
        run: node scripts/validate-phenomena-discoveries.mjs

      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js

      - name: Validate parallel beta-decay gameplay
        run: node scripts/validate-beta-parallel.js

      - name: Validate rotation option
        run: node scripts/validate-rotation-option.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
