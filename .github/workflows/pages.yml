name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check engine syntax
        run: node --check assets/js/ardua.js

      - name: Check rotation syntax
        run: node --check assets/js/rotation-polish.js

      - name: Check audio polish syntax
        run: node --check assets/js/audio-polish.js

      - name: Check recipe audio syntax
        run: node --check assets/js/recipe-audio-sync.js

      - name: Check campaign UX syntax
        run: |
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-fork-links.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-giants-map.js
          node --check assets/js/campaign-phase-modal.js
          node --check assets/js/phase-polish.js
          node --check assets/js/campaign-home-polish.js
          node --check assets/js/campaign-discoveries-elements.js
          node --check assets/js/campaign-discoveries-phenomena.js

      - name: Validate element sources
        run: node scripts/validate-element-sources.mjs

      - name: Validate phenomenon sources
        run: node scripts/validate-phenomenon-sources.mjs

      - name: Validate phenomena discoveries
        run: node scripts/validate-phenomena-discoveries.mjs

      - name: Validate stellar plasma phases
        run: node scripts/validate-stellar-plasma.js

      - name: Validate movement, chain knowledge and particle selection
        run: node scripts/validate-movement-chain-particles.js

      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js

      - name: Validate parallel beta-decay gameplay
        run: node scripts/validate-beta-parallel.js

      - name: Validate rotation option
        run: node scripts/validate-rotation-option.js

      - name: Validate target-recipe audio cadence
        run: node scripts/validate-recipe-audio-cadence.js

      - name: Validate menu discoveries UX
        run: node scripts/validate-menu-discoveries-ux.js

      - name: Validate campaign phase flow
        run: node scripts/validate-campaign-phase-flow.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
