name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Refine stellar convection interaction
        run: |
          python -m py_compile .github/scripts/refine_stellar_convection.py
          python .github/scripts/refine_stellar_convection.py
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/css/ardua.css')
          p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
          node --check assets/js/ardua.js
          node --check assets/js/campaign-discoveries.js
          git diff --check

      - name: Commit refined convection interaction
        run: |
          git config user.name "Ardua Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Refine stellar convection core interaction [skip ci]"
          git push origin HEAD:main

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
