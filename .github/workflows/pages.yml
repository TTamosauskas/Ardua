name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fix stellar start tap
        run: |
          python -m py_compile .github/scripts/fix_stellar_start_tap.py
          python .github/scripts/fix_stellar_start_tap.py
          node --check assets/js/ardua.js
          git diff --check

      - name: Commit stellar start tap fix
        run: |
          git config user.name "Ardua Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/js/ardua.js
          git diff --cached --check
          git commit -m "Fix stellar start touch input [skip ci]"
          git push origin HEAD:main

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
