name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check engine syntax
        run: node --check assets/js/ardua.js

      - name: Check rotation syntax
        run: node --check assets/js/rotation-polish.js

      - name: Check audio polish syntax
        run: node --check assets/js/audio-polish.js

      - name: Check recipe audio syntax
        run: node --check assets/js/recipe-audio-sync.js

      - name: Check campaign UX syntax
        run: |
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-fork-links.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-exploration.js
          node --check assets/js/campaign-runtime-sync.js
          node --check assets/js/campaign-phase-completion.js
          node --check assets/js/reaction-chain-feedback.js
          node --check assets/js/campaign-giants-map.js
          node --check assets/js/campaign-phase-modal.js
          node --check assets/js/phase-polish.js
          node --check assets/js/campaign-home-polish.js
          node --check assets/js/campaign-phase-labels.js
          node --check assets/js/campaign-phase-names.js
          node --check assets/js/campaign-forge-names.js
          node --check assets/js/campaign-discoveries-elements.js
          node --check assets/js/campaign-element-bohr.js
          node --check assets/js/campaign-discoveries-phenomena.js
          node --check assets/js/campaign-discovery-notifications.js
          node --check assets/js/campaign-quarks-graph.js
          node --check assets/js/campaign-quarks.js
          node --check assets/js/campaign-quarks-chrome.js
          node --check assets/js/campaign-quarks-map.js
          node --check assets/js/campaign-quarks-discoveries.js

      - name: Validate element sources
        run: node scripts/validate-element-sources.mjs

      - name: Validate element Bohr model
        run: node scripts/validate-element-bohr.js

      - name: Validate phenomenon sources
        run: node scripts/validate-phenomenon-sources.mjs

      - name: Validate phenomena discoveries
        run: node scripts/validate-phenomena-discoveries.mjs

      - name: Validate stellar plasma phases
        run: node scripts/validate-stellar-plasma.js

      - name: Validate coronal jets
        run: node scripts/validate-coronal-jets.js

      - name: Validate convection runtime
        run: node scripts/validate-convection-regression.js

      - name: Validate movement, chain knowledge and particle selection
        run: node scripts/validate-movement-chain-particles.js

      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js

      - name: Validate objective-safe reaction chains
        run: node scripts/validate-objective-safe-chain.js

      - name: Validate precursor recipe planner
        run: node scripts/validate-recipe-planner.js

      - name: Validate phase runtime identity and recipe guidance
        run: node scripts/validate-phase-runtime-sync.js

      - name: Validate stalled objective phase endings
        run: node scripts/validate-objective-phase-end.js

      - name: Validate universal phase completion contract
        run: node scripts/validate-phase-completion-contract.js

      - name: Validate reaction chain feedback
        run: node scripts/validate-reaction-chain-feedback.js

      - name: Validate stellar dispersal appreciation pause
        run: node scripts/validate-scatter-appreciation.js

      - name: Validate global victory fanfare
        run: node scripts/validate-victory-fanfare.js

      - name: Validate parallel beta-decay gameplay
        run: node scripts/validate-beta-parallel.js

      - name: Validate rotation option
        run: node scripts/validate-rotation-option.js

      - name: Validate target-recipe audio cadence
        run: node scripts/validate-recipe-audio-cadence.js

      - name: Validate menu discoveries UX
        run: node scripts/validate-menu-discoveries-ux.js

      - name: Validate discovery inbox
        run: node scripts/validate-discovery-inbox.js

      - name: Validate campaign phase flow
        run: node scripts/validate-campaign-phase-flow.js

      - name: Validate campaign runtime regressions
        run: node scripts/validate-campaign-runtime-regressions.js

      - name: Validate compact phase goal hierarchy
        run: node scripts/validate-phase-goal-hierarchy.js

      - name: Validate phase layout consistency
        run: node scripts/validate-phase-layout-consistency.js

      - name: Validate Quarks phase
        run: node scripts/validate-quarks-phase.js

      - name: Validate Quarks chrome
        run: node scripts/validate-quarks-chrome.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
