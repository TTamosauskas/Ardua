name: Inspect fusion tap handler

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Print handler
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('assets/js/ardua.js','utf8');
          const a=s.indexOf('function handleFusionTap(p)');
          const b=s.indexOf('\nfunction beginCrushHold',a);
          if(a<0||b<0) throw new Error('handler bounds not found');
          console.log(s.slice(a,b));
          NODE
