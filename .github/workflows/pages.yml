name: Deploy Ardua to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-elements:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch Wikipedia element image shard
        run: node scripts/fetch-element-wikipedia-shard.mjs ${{ matrix.shard }} 8 .element-shard

      - name: Upload element image shard
        uses: actions/upload-artifact@v4
        with:
          name: element-shard-${{ matrix.shard }}
          path: .element-shard
          retention-days: 1

  deploy:
    needs: sync-elements
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download element image shards
        uses: actions/download-artifact@v4
        with:
          pattern: element-shard-*
          path: .element-shards

      - name: Merge Wikipedia element images
        run: node scripts/merge-element-wikipedia-shards.mjs .element-shards

      - name: Persist synchronized element images
        run: |
          if [[ -n "$(git status --porcelain -- assets/data/element-sources.json assets/images/elements)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/element-sources.json assets/images/elements
            git commit -m "Sincroniza imagens Wikipedia dos elementos"
            git push
          fi

      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
