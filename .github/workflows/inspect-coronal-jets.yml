name: Inspect coronal jets integration

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-coronal-jets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Print execution details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text()
          for needle in [
            'function campaignKnowledgeReached','function performConvection','function convectionPath(','function tapConvection','convectionPathCells=',
            'function renderPrimordialParticles','function ensureCumulativeParticleFuel','function objectiveSatisfied','function currentProgress','function phaseRadius',
            'const state=','productLessons:new Set','function save()','stellarIonizations:',
          ]:
              i=s.find(needle)
              print(f'\n===== {needle} @ {i} =====')
              if i>=0: print(s[max(0,i-2200):i+7500])
          for path,needle in [
            ('assets/js/campaign-mode.js','function isUnlocked'),
            ('assets/js/campaign-mode.js','function normalizeState'),
            ('assets/js/campaign-map.js','baseOrder'),
            ('scripts/validate-phenomena-discoveries.mjs','Ionização'),
          ]:
              t=Path(path).read_text();i=t.find(needle);print(f'\n######## {path} :: {needle} @ {i} ########');print(t[max(0,i-1600):i+5000] if i>=0 else '')
          PY
