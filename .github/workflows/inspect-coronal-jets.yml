name: Inspect coronal jets integration

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-coronal-jets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Print phase hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text()
          for needle in [
            'function fillStage(){',"if(s.mode==='convection')",'function startPhase','const PRODUCT_LESSONS','function closeEventTooltip',
            'function updateHUD','function endPhaseAction','function phaseCompletionReward','function createPiece(', 'function clearBoard()'
          ]:
              i=s.find(needle)
              print(f'\n===== {needle} @ {i} =====')
              if i>=0: print(s[max(0,i-2200):i+10000])
          for path,needle in [
            ('assets/js/campaign-mode.js','const MAP_KEY'),
            ('assets/js/campaign-mode.js','if(previousVersion<13)'),
            ('scripts/validate-stellar-plasma.js','version:13'),
            ('assets/data/phenomenon-sources.json','"Vento Solar"'),
            ('assets/data/phenomenon-sources.json','"Ionização"')
          ]:
              t=Path(path).read_text();i=t.find(needle);print(f'\n######## {path} :: {needle} @ {i} ########');print(t[max(0,i-600):i+2800] if i>=0 else '')
          PY
