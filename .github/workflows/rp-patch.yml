name: Apply Ardua rp-process patch

on:
  push:
    paths:
      - 'rp-patch/READY'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply and validate rp-process patch
        shell: bash
        run: |
          set -euo pipefail
          cat rp-patch/p00 rp-patch/p01 rp-patch/p02 rp-patch/p03 rp-patch/p04 rp-patch/p05 rp-patch/p06 rp-patch/p07 \
            | base64 -d > /tmp/ardua-rp.patch.xz
          xz -dc /tmp/ardua-rp.patch.xz > /tmp/ardua-rp.patch
          git apply /tmp/ardua-rp.patch
          echo '12e5972dacabc16daa63fc1e7659dd4d747be9f11b0947b229a7eee7c2bada78  assets/js/ardua.js' | sha256sum -c -
          node --check assets/js/ardua.js
          node tests/validate-static.js
      - name: Commit clean engine
        shell: bash
        run: |
          set -euo pipefail
          rm -rf rp-parts rp-patch .github/workflows/rp-assemble.yml .github/workflows/rp-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add rp-process campaign from Cu to Te'
          git push
