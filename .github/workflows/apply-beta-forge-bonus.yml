name: Apply beta forge bonus
on:
  push:
    paths:
      - '.github/workflows/apply-beta-forge-bonus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Apply beta forge mechanics
        run: node scripts/apply-beta-forge-bonus.js

      - name: Check JavaScript syntax
        run: node --check assets/js/ardua.js && node --check assets/js/beta-bonus-ui.js

      - name: Validate cumulative recipes
        run: node scripts/validate-cumulative-recipes.js

      - name: Validate beta forge bonuses
        run: node scripts/validate-beta-forge-bonus.js

      - name: Persist migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js index.html
          git rm scripts/apply-beta-forge-bonus.js
          git commit -m "Adiciona objetivos bônus durante esperas beta"
          git push
