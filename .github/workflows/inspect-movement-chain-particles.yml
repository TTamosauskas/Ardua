name: Inspect movement chain particles

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-movement-chain-particles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect movement and knowledge sections
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text(encoding='utf-8')
          def show(needle,before=1200,after=6500):
            i=s.find(needle); print(f'\n=== {needle} @ {i} ==='); print(s[max(0,i-before):min(len(s),i+after)] if i>=0 else 'NOT FOUND')
          for needle in [
            'function movementUnlocked','function movementTargetCells','function selectAtomForMovement','async function moveSelectedAtom',
            'function learnedNeutronTransitions','function phaseNeutronTransitions','function universalNeutronCaptureEligible',
            'function handleFusionTap','function contextualObjectiveLine','function modalPrimaryLine','function modalSecondaryLine',
            'phaseEndBtn.textContent','endLabel'
          ]: show(needle)
          PY
