name: Inspect movement chain particles

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-movement-chain-particles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect exact tap handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text(encoding='utf-8')
          for start,end in [('function tapAtom(id){','function tapCell('),('function tapPrimordialParticle(id){','function tapPrimordial'),('function modalPrimaryLine','function phaseIntroGroup')]:
            a=s.find(start);b=s.find(end,a+len(start));print('\n===',start,a,'===');print(s[a:b if b>a else a+15000])
          PY
