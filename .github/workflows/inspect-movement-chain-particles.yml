name: Inspect movement chain particles

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-movement-chain-particles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect auto-chain sections
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text(encoding='utf-8')
          def show(needle,before=1000,after=6500):
            i=s.find(needle); print(f'\n=== {needle} @ {i} ==='); print(s[max(0,i-before):min(len(s),i+after)] if i>=0 else 'NOT FOUND')
          for needle in [
            'function campaignKnowledgeReached','function autoFusionCandidate','function scheduleAutoFusionCascade',
            'function neutronTrajectoryCandidate','function scheduleNeutronCascade','function scheduleAutoProtonCascade',
            'function scheduleAutoEnergeticCascade'
          ]: show(needle)
          PY
