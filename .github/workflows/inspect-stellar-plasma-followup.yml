name: Inspect stellar plasma follow-up

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-stellar-plasma-followup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          needles=['Descobertas da fase','showCoulombTooltip','function showCoulomb','eventTooltipBtn','ambientContinueBtn','solar_wind','stellar_convection']
          for needle in needles:
              print('\n===== SEARCH',needle,'=====')
              for p in root.rglob('*'):
                  if not p.is_file() or p.suffix.lower() not in {'.js','.html','.css','.json'}: continue
                  try:s=p.read_text(encoding='utf-8')
                  except:continue
                  for m in list(re.finditer(re.escape(needle),s,re.I))[:5]:
                      i=m.start();print('\n###',p,'@',i);print(s[max(0,i-2200):min(len(s),i+5200)])
          # Map-specific branch-selection/visibility logic.
          p=Path('assets/js/campaign-map.js');s=p.read_text(encoding='utf-8')
          for needle in ['function inferAncestorBranches','function openMap','function renderMap','function activateBranch','G.sequences.mid']:
              i=s.find(needle)
              if i>=0: print('\n===== MAP',needle,'=====\n',s[max(0,i-1200):min(len(s),i+6500)])
          PY
