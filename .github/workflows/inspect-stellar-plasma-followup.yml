name: Inspect stellar plasma follow-up

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-stellar-plasma-followup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect fillStage Coulomb boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text(encoding='utf-8')
          f=s.find('function fillStage()')
          c=s.find("if(s.id==='coulomb_intro'){",f)
          print('fillStage',f,'coulomb',c)
          print(s[max(f,c-2500):c+14000])
          print('\nNEXT FUNCTION AFTER COULOMB:')
          import re
          for m in re.finditer(r'\n(?:async\s+)?function\s+[A-Za-z0-9_]+',s[c:]):
            print(c+m.start(),repr(m.group(0)));break
          PY
