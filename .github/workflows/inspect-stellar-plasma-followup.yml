name: Inspect stellar plasma follow-up

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-stellar-plasma-followup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect exact runtime functions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text(encoding='utf-8')
          def show(needle,before=900,after=4200):
            i=s.find(needle);print(f'\n=== {needle} @ {i} ===');print(s[max(0,i-before):min(len(s),i+after)] if i>=0 else 'NOT FOUND')
          for needle in ["{id:'he_yellow'",'function showCoulombTooltip','showAmbientEvent','function showEventTooltip','eventTooltipBtn','function ionizeStellarAtom','function recombineStellarIon','async function advanceStellarAtomicPhase','function showStellarPopup']:
            show(needle)
          PY
