name: Apply high-mass formation visibility
on:
  push:
    branches:
      - fix/high-mass-formation-visible
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/high-mass-formation-visible
      - name: Apply patch
        run: node scripts/patch-high-mass-formation-visible.js
      - name: Validate syntax
        run: |
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-phase-names.js
      - name: Validate cumulative recipes
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate high-mass formation visibility
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const mode=fs.readFileSync('assets/js/campaign-mode.js','utf8');
          const names=fs.readFileSync('assets/js/campaign-phase-names.js','utf8');
          const engine=fs.readFileSync('assets/js/ardua.js','utf8');
          const graph=fs.readFileSync('assets/js/campaign-graph.js','utf8');
          if(!mode.includes("version:10"))throw new Error('campaign save v10 missing');
          if(!mode.includes("next.completed=next.completed.filter(id=>id!=='high_mass_formation')"))throw new Error('high mass reopen migration missing');
          if(!mode.includes("if(next.activeId==='carbon_burn')next.activeId='high_mass_formation'"))throw new Error('carbon burn redirect missing');
          if(!names.includes("high_mass_formation:'Formação da Estrela de Alta Massa'"))throw new Error('explicit phase name missing');
          const phase=engine.split('\n').find(x=>x.includes("id:'high_mass_formation'"));
          if(!phase?.includes('formationLayers:5,target:91'))throw new Error('five outer layers / 91 H missing');
          if(!phase?.includes('Reúna 45 duplas de H'))throw new Error('45 pairs missing');
          const highSeq=graph.match(/"high":\[(.*?)\]/)?.[1]||'';
          if(highSeq.indexOf('high_mass_formation')<0||highSeq.indexOf('carbon_burn')<0||highSeq.indexOf('high_mass_formation')>highSeq.indexOf('carbon_burn'))throw new Error('high mass phase is not before carbon burn');
          console.log('high-mass formation visibility invariants ok');
          NODE
      - name: Commit product change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/campaign-mode.js assets/js/campaign-phase-names.js
          git commit -m "fix: reabre formação de alta massa nos saves existentes"
          git push
