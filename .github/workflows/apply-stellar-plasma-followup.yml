name: Apply stellar plasma follow-up

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-stellar-plasma-followup.py"
      - ".github/workflows/apply-stellar-plasma-followup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply follow-up
        run: python scripts/apply-stellar-plasma-followup.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-giants-map.js
          node --check assets/js/campaign-phase-modal.js
          node --check assets/js/campaign-discoveries.js
          node --check assets/js/campaign-discoveries-phenomena.js
          node --check scripts/validate-stellar-plasma.js
      - name: Validate feature and existing contracts
        run: |
          node scripts/validate-stellar-plasma.js
          node scripts/validate-phenomenon-sources.mjs
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-rotation-option.js
          node scripts/validate-beta-parallel.js
          node scripts/validate-recipe-audio-cadence.js
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/js/campaign-giants-map.js assets/js/campaign-phase-modal.js assets/js/campaign-discoveries.js assets/js/campaign-discoveries-phenomena.js assets/data/phenomenon-sources.json scripts/validate-phenomenon-sources.mjs scripts/validate-phenomena-discoveries.mjs scripts/validate-stellar-plasma.js
          git diff --cached --quiet || git commit -m "feat: refine stellar plasma continuity and tutorials"
          git push
