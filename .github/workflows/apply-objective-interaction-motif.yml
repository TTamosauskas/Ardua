name: Apply objective interaction motif
on:
  push:
    paths:
      - '.github/objective-interaction-motif.py'
      - '.github/workflows/apply-objective-interaction-motif.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile migration source
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/objective-interaction-motif.py').read_text()
          compile(src,'.github/objective-interaction-motif.py','exec')
          print('migration syntax ok')
          PY
      - name: Normalize README motif paragraph
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text()
          old="Durante o Reaction Motif, o áudio adaptativo e banners secundários cedem prioridade à reação principal, e `prefers-reduced-motion` reduz o deslocamento visual sem remover a informação sonora.\n\nAs notas do Reaction Motif usam ganho reforçado e um harmônico uma oitava acima para permanecerem audíveis também em alto-falantes pequenos. O produto real da grade é renderizado por baixo da cerimônia e mantido invisível até o instante final; quando a apresentação central termina, ela revela o núcleo já colocado na célula definitiva, evitando uma segunda animação de transformação ao retornar ao tabuleiro."
          new="Durante o Reaction Motif, o áudio adaptativo e banners secundários cedem prioridade à reação principal, e `prefers-reduced-motion` reduz o deslocamento visual sem remover a informação sonora. As notas individuais receberam ganho e um harmônico superior para permanecerem audíveis em alto-falantes pequenos; no encerramento da cerimônia, o produto real já está pré-renderizado e oculto na célula de destino, de modo que o overlay apenas entrega a imagem ao tabuleiro e não existe uma segunda transformação visual."
          if old not in text:
              raise SystemExit('README normalization anchor not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Apply migration
        run: python .github/objective-interaction-motif.py
      - name: Validate JavaScript
        run: node --check assets/js/ardua.js
      - name: Validate Ardua
        run: node tests/validate-static.js
      - name: Verify staging cleanup
        run: |
          test ! -e .github/objective-interaction-motif.py
          test ! -e .github/workflows/apply-objective-interaction-motif.yml
          test ! -d .github/__pycache__
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extend reaction motif to particle interactions"
          git push
