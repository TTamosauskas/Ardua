name: Preserve first generation formation scale
on:
  push:
    branches:
      - fix/preserve-first-generation-atom-scale
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/preserve-first-generation-atom-scale
      - name: Apply patch
        run: node scripts/patch-preserve-first-generation-scale.js
      - name: Validate syntax
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipes
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate formation scales
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('assets/js/ardua.js','utf8');
          if(!s.includes("s?.id==='first_generation_formation'?4:spec.radius"))throw new Error('first-generation approved five-layer atom scale missing');
          for(const [id,layers,total] of [['low_mass_formation',2,7],['intermediate_mass_formation',3,19],['giant_formation',4,37],['high_mass_formation',5,61]]){
            if(!new RegExp(`id:'${id}'[^\\n]*formationLayers:${layers},target:${total}`).test(s))throw new Error(id);
          }
          if(!s.includes('if(candidates[0])compatible.add(candidates[0].id)'))throw new Error('two-group highlight rule missing');
          NODE
      - name: Commit product change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git commit -m "fix: preserva escala aprovada da primeira geração"
          git push
