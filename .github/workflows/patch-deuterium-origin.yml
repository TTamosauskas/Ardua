name: Patch primordial deuterium origin

on:
  push:
    branches:
      - fix/primordial-deuterium-meeting-point

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/primordial-deuterium-meeting-point
          fetch-depth: 0
      - name: Patch meeting point behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/ardua.js')
          text=p.read_text()
          start=text.index('async function reactPrimordialParticlePair(r,a,b){')
          end=text.index('\nasync function reactPrimordialMixed',start)
          fn=text[start:end]
          if 'const reactionPoint=' in fn:
              raise SystemExit('reactionPoint already present')
          old="state.locked=true;state.primordialSelected=null;const motif=goal?await objectiveInteractionPrelude(`primordial:${s.id}:${r.out}`,[objectiveInteractionPrimordialToken(a),objectiveInteractionPrimordialToken(b)],r.out,{x,y}):null;"
          new=old+"const reactionPoint=r.id==='pn_d'&&motif?{x:motif.center,y:motif.center}:{x,y};"
          if old not in fn:
              raise SystemExit('motif anchor not found')
          fn=fn.replace(old,new,1)
          old_spawn='const spawn=createParticleReactionProduct(r.out,x,y,{massNumber:r.mass,longRadioactive:!!r.longRadioactive})'
          new_spawn='const spawn=createParticleReactionProduct(r.out,reactionPoint.x,reactionPoint.y,{massNumber:r.mass,longRadioactive:!!r.longRadioactive})'
          if old_spawn not in fn:
              raise SystemExit('product spawn anchor not found')
          fn=fn.replace(old_spawn,new_spawn,1)
          old_reveal='if(motif)await objectiveInteractionRevealPiece(motif,out,{x,y});else render();burst(x,y);'
          new_reveal='if(motif)await objectiveInteractionRevealPiece(motif,out,reactionPoint);else render();burst(reactionPoint.x,reactionPoint.y);'
          if old_reveal not in fn:
              raise SystemExit('reveal anchor not found')
          fn=fn.replace(old_reveal,new_reveal,1)
          text=text[:start]+fn+text[end:]
          p.write_text(text)
          PY
      - name: Validate engine syntax and contract
        run: |
          node --check assets/js/ardua.js
          python - <<'PY'
          from pathlib import Path
          text=Path('assets/js/ardua.js').read_text()
          start=text.index('async function reactPrimordialParticlePair(r,a,b){')
          end=text.index('\nasync function reactPrimordialMixed',start)
          fn=text[start:end]
          required=[
            "const reactionPoint=r.id==='pn_d'&&motif?{x:motif.center,y:motif.center}:{x,y}",
            'createParticleReactionProduct(r.out,reactionPoint.x,reactionPoint.y',
            'objectiveInteractionRevealPiece(motif,out,reactionPoint)',
            'burst(reactionPoint.x,reactionPoint.y)'
          ]
          missing=[x for x in required if x not in fn]
          if missing:
              raise SystemExit('missing contract: '+', '.join(missing))
          print('Primordial p+n -> D meeting-point contract OK')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-deuterium-origin.yml
          git add assets/js/ardua.js
          git commit -m "Keep primordial deuterium at the reaction point"
          git push origin HEAD:fix/primordial-deuterium-meeting-point
