name: Apply parallel beta-decay gameplay update

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-beta-parallel-update.py"
      - ".github/workflows/apply-beta-parallel-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply beta gameplay migration
        run: python scripts/apply-beta-parallel-update.py
      - name: Smoke-check migration
        run: |
          grep -q "beta-progress-ring" assets/js/ardua.js
          grep -q "Zn.*decaindo\|decaindo" assets/js/ardua.js
          grep -q "neutronBetaRounds:4" assets/js/ardua.js
          grep -q "beta-progress-ring" assets/css/phase-polish.css
      - name: Commit migrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/css/phase-polish.css
          git diff --cached --quiet || git commit -m "feat: parallelize beta-decay waiting gameplay"
          git push
