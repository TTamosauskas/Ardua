name: Patch cumulative recipe execution

on:
  push:
    branches:
      - fix/cumulative-recipe-execution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cumulative-recipe-execution
          fetch-depth: 0
      - name: Apply cumulative recipe fix
        run: python scripts/_patch_cumulative_recipe_execution.py
      - name: Validate cumulative recipe architecture
        run: |
          node --check assets/js/ardua.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-recipe-planner.js
          node scripts/validate-campaign-runtime-regressions.js
      - name: Commit cumulative recipe fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-cumulative-recipe-execution.yml scripts/_patch_cumulative_recipe_execution.py
          git add assets/js/ardua.js scripts/validate-cumulative-recipes.js CUMULATIVE_RECIPE_CONTRACT.md
          git commit -m "Preserve cumulative fusion execution priority"
          git push origin HEAD:fix/cumulative-recipe-execution
