name: Apply objective motif handoff
on:
  push:
    paths:
      - '.github/objective-motif-handoff.py'
      - '.github/workflows/apply-objective-motif-handoff.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile migration source
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/objective-motif-handoff.py').read_text()
          compile(src,'.github/objective-motif-handoff.py','exec')
          print('migration syntax ok')
          PY
      - name: Apply migration
        run: python .github/objective-motif-handoff.py
      - name: Validate JavaScript
        run: node --check assets/js/ardua.js
      - name: Validate Ardua
        run: node tests/validate-static.js
      - name: Verify staging cleanup
        run: |
          test ! -e .github/objective-motif-handoff.py
          test ! -e .github/workflows/apply-objective-motif-handoff.yml
          test ! -d .github/__pycache__
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen motif audio and hand off product cleanly"
          git push
