name: Patch stellar plasma knowledge gates

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/patch-stellar-plasma-gates.py"
      - ".github/workflows/patch-stellar-plasma-gates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply knowledge gates
        run: python scripts/patch-stellar-plasma-gates.py
      - name: Check syntax and contracts
        run: |
          node --check assets/js/ardua.js
          node --check scripts/validate-stellar-plasma.js
          node scripts/validate-stellar-plasma.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-beta-parallel.js
          node scripts/validate-rotation-option.js
          node scripts/validate-recipe-audio-cadence.js
      - name: Commit runtime gate fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js scripts/validate-stellar-plasma.js
          git diff --cached --quiet || git commit -m "fix: gate stellar recombination after ionization lesson"
          git push
