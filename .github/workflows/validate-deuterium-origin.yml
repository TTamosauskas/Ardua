name: Validate primordial deuterium origin

on:
  push:
    branches:
      - fix/primordial-deuterium-meeting-point

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/primordial-deuterium-meeting-point
          fetch-depth: 0
      - name: Validate targeted regressions
        run: |
          node --check assets/js/ardua.js
          node scripts/validate-campaign-runtime-regressions.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-cumulative-recipes.js
      - name: Remove temporary validator workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-deuterium-origin.yml
          git commit -m "Remove temporary deuterium validator"
          git push origin HEAD:fix/primordial-deuterium-meeting-point
