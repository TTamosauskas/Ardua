name: Apply stellar particle shell

on:
  push:
    branches:
      - fix/stellar-particle-shell
    paths:
      - .github/workflows/apply-stellar-particle-shell.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-stellar-particle-shell.yml
      - scripts/apply-stellar-particle-shell.py
      - scripts/refine-stellar-particle-shell.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: fix/stellar-particle-shell
          fetch-depth: 0

      - name: Ensure base stellar particle patch
        shell: bash
        run: |
          if grep -q "function nearestOpenStellarCell" assets/js/ardua.js; then
            echo "Base stellar particle patch already present"
          else
            python3 scripts/apply-stellar-particle-shell.py
          fi

      - name: Apply final refinements
        run: python3 scripts/refine-stellar-particle-shell.py

      - name: Check JavaScript syntax
        run: node --check assets/js/ardua.js

      - name: Run static validation against current engine baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/validate-static.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            "COULOMB_BLOCK_CHANCE_BY_RING=Object.freeze({0:0,1:0,2:.5,3:.6,4:.8})":"COULOMB_BLOCK_CHANCE_BY_RING=Object.freeze({0:0,1:0,2:.10,3:.20,4:.40,5:.50})",
            "$('ambientContinueBtn').addEventListener('click',rewardDirectorDismiss)":"bindReliableTap($('ambientContinueBtn'),rewardDirectorDismiss)",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected stale baseline assertion was not found: {old}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          node tests/validate-static.js
          git checkout -- tests/validate-static.js

      - name: Validate stellar particle implementation
        shell: bash
        run: |
          grep -q "function createParticleReactionProduct" assets/js/ardua.js
          grep -q "function advanceStellarShellParticle" assets/js/ardua.js
          grep -q "createParticleReactionProduct('H'" assets/js/ardua.js
          grep -q "createParticleReactionProduct('D'" assets/js/ardua.js
          grep -q "Math.random()*Math.PI*2" assets/js/ardua.js
          grep -q "primordial-particle.candidate{opacity:.76}" assets/css/ardua.css
          grep -q "neutron.candidate{opacity:.76}" assets/css/ardua.css
          ! grep -q "advanceCoreOrbitParticle" assets/js/ardua.js
          ! grep -q "placeNeutronOnCoreOrbit" assets/js/ardua.js

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/css/ardua.css
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "fix: refine stellar particle shell behavior"
            git push origin HEAD:fix/stellar-particle-shell
          fi
