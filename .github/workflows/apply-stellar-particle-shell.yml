name: Apply stellar particle shell

on:
  push:
    branches:
      - fix/stellar-particle-shell
    paths:
      - .github/workflows/apply-stellar-particle-shell.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/stellar-particle-shell
          fetch-depth: 0

      - name: Apply stellar particle patch
        run: python3 scripts/apply-stellar-particle-shell.py

      - name: Check JavaScript syntax
        run: node --check assets/js/ardua.js

      - name: Run static validation
        run: node tests/validate-static.js

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/css/ardua.css
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "feat: materialize stellar particle products and orbit shell"
            git push origin HEAD:fix/stellar-particle-shell
          fi
