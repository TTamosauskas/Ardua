name: Assemble Ardua assets

on:
  push:
    branches: [main]
    paths:
      - source-parts/READY

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble static assets
        shell: bash
        run: |
          mkdir -p assets/css assets/js
          cat source-parts/css/*.b64 | tr -d '\n' | base64 --decode > assets/css/ardua.css
          cat source-parts/js/*.b64 | tr -d '\n' | base64 --decode > assets/js/ardua.js
          node --check assets/js/ardua.js
          test -s assets/css/ardua.css
      - name: Commit assembled repository
        shell: bash
        run: |
          rm -rf source-parts
          rm -f .github/workflows/assemble.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'Ardua bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Add Ardua game engine and visual assets'
          git push origin main
