name: Apply reaction feedback and cascades

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-chain-feedback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration helper
        run: python -m py_compile .github/chain-feedback-v2.py
      - name: Apply reaction feedback migration
        run: python .github/chain-feedback-v2.py
      - name: Validate engine and cascade invariants
        shell: bash
        run: |
          node --check assets/js/ardua.js
          node tests/validate-static.js
          grep -Fq "const CHAIN_AUTO_FLOW_FACTORS=Object.freeze([.25,.10,0]);" assets/js/ardua.js
          grep -Fq "const CHAIN_MAX_PROGRESS_BONUS=.10;" assets/js/ardua.js
          grep -Fq "const CHAIN_OBJECTIVE_PROGRESS_FLOOR=.75;" assets/js/ardua.js
          grep -Fq "function scheduleAutoFusionCascade" assets/js/ardua.js
          grep -Fq "function scheduleNeutronCascade" assets/js/ardua.js
          grep -Fq "function scheduleAutoProtonCascade" assets/js/ardua.js
          grep -Fq "function captureTag(x,y,text){if(!dom.fx" assets/js/ardua.js
          grep -Fq "Reaction feedback + causal cascades" assets/css/ardua.css
          ! grep -Fq "calc(var(--resonanceGlow" assets/css/ardua.css
      - name: Commit clean result
        shell: bash
        run: |
          rm -f .github/chain-feedback.part0 .github/chain-feedback.part1 .github/chain-feedback.part2 .github/chain-feedback.part3 .github/chain-feedback.part4
          rm -f .github/chain-feedback-fix.py .github/chain-feedback-v2.py .github/workflows/apply-chain-feedback.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add reaction feedback and causal cascades'
          git push
