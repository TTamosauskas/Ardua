name: Apply formation modal copy
on:
  push:
    branches:
      - fix/formation-modal-copy
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/formation-modal-copy
      - name: Apply patch
        run: node scripts/patch-formation-modal-copy.js
      - name: Validate syntax
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate modal copy
        run: |
          grep -F "Atraia moleculas com a gravidade" assets/js/ardua.js
          grep -F "if(s.mode==='stellarFormation')return '';" assets/js/ardua.js
          if grep -F "18 duplas de H → 1 vaga final → H automático → hexágono de 37 H" assets/js/ardua.js; then exit 1; fi
          if grep -F "Selecione duplas e aglomerados quando seus campos g se sobrepuserem. As duplas vagam à frente dos hexágonos em formação; ao restar uma vaga, o H final entra automaticamente." assets/js/ardua.js; then exit 1; fi
      - name: Commit product change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git commit -m "fix: simplifica modal da formação estelar"
          git push
