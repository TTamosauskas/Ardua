name: Audit cumulative recipes

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-cumulative.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect cumulative reaction paths
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('assets/js/ardua.js','utf8');
          const names=['recipeEnvironmentAllows','fusionRecipeCompatible','learnedFusionRecipes','activeFusionRecipes','phaseFusionRecipes','fusionSandboxAllowed','learnedPrimordialNuclearReactions','primordialParticlePairReaction','primordialPossiblePieceRecipes','tapFreeAtom','tapPrimordialParticle','renderPrimordialParticles','renderNeutrons','captureNeutron','ensureOpportunity','setupPhase','resetPhase'];
          function extract(name){let a=s.indexOf(`function ${name}(`);if(a<0)a=s.indexOf(`const ${name}=`);if(a<0){console.log(`\n=== ${name}: MISSING ===`);return}let points=[s.indexOf('\nfunction ',a+10),s.indexOf('\nconst ',a+10)].filter(x=>x>a);let end=Math.min(points.length?Math.min(...points):s.length,a+15000);console.log(`\n=== ${name} ===\n`+s.slice(a,end));}
          names.forEach(extract);
          const modes=[...s.matchAll(/mode:'([^']+)'/g)].map(m=>m[1]);console.log('\n=== MODES ===\n'+[...new Set(modes)].join('\n'));
          for(const q of ['ensurePrimordialParticleMix(',"state.neutronCaptureUnlocked=true","state.neutronCaptureUnlocked=",'learnedPrimordialNuclearReactions()','activeFusionRecipes()']){console.log(`\n=== SEARCH ${q} ===`);let i=-1,count=0;while((i=s.indexOf(q,i+1))>=0&&count++<20)console.log(s.slice(Math.max(0,i-450),Math.min(s.length,i+900)));}
          NODE
