name: Apply primordial motion toggle

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-primordial-motion-toggle.py"
      - ".github/workflows/apply-primordial-motion-toggle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply primordial motion toggle
        run: python scripts/apply-primordial-motion-toggle.py
      - name: Check engine syntax
        run: node --check assets/js/ardua.js
      - name: Smoke-check integration
        run: |
          grep -q 'function rotationMotionEnabled' assets/js/ardua.js
          grep -q "ardua:rotation-change" assets/js/ardua.js
          grep -q '!rotationMotionEnabled()||s.mode' assets/js/ardua.js
          grep -q 'stopPrimordialMoleculeDrift' assets/js/ardua.js
      - name: Commit integrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git diff --cached --quiet || git commit -m "feat: pause primordial motion with rotation toggle"
          git push
