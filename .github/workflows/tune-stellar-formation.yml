name: Tune stellar formation dispersion
on:
  push:
    branches: [fix/stellar-formation-dispersion]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stellar-formation-dispersion
          fetch-depth: 0
      - name: Apply formation tuning
        run: node scripts/tune-stellar-formation.js
      - name: Validate JavaScript
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate requested behavior
        run: node -e "const fs=require('fs');const j=fs.readFileSync('assets/js/ardua.js','utf8'),c=fs.readFileSync('assets/css/stellar-formation.css','utf8');const ok=!j.includes('g.vx+=dx*.0000017*dt')&&j.includes('maxR*Math.sqrt(Math.random())')&&j.includes('f.stabilizing=true')&&j.includes(\"classList.add('formation-stabilized')\")&&j.includes('stellarFormationOverlap(a,b)')&&!j.includes(\"hud=document.createElement('div')\")&&c.includes('.star-board.stellar-formation-mode .star-core{opacity:0}')&&c.includes('.star-board.stellar-formation-mode.formation-stabilized .star-core{opacity:1}')&&c.includes('.formation-hud{display:none!important}')&&c.includes('.formation-g-field{');if(!ok)throw new Error('formation tuning invariant failed')"
      - name: Commit product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/tune-stellar-formation.yml scripts/tune-stellar-formation.js
          git add assets/js/ardua.js assets/css/stellar-formation.css
          git commit -m "Ajusta dispersão e campos g da formação estelar"
          git push origin HEAD:fix/stellar-formation-dispersion
