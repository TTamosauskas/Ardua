name: Fix element detail opening

on:
  push:
    branches: ["fix/element-detail-open-robust"]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/element-detail-open-robust

      - name: Apply robust element opening patch
        run: node scripts/_patch_element_detail_open_robust.mjs

      - name: Check syntax and static regressions
        run: |
          node --check assets/js/campaign-discoveries-elements.js
          node scripts/validate-instant-discovery-details.js
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-element-sources.mjs
          node scripts/validate-campaign-runtime-regressions.js

      - name: Browser smoke test for touch opening
        run: |
          python3 -m pip install --quiet selenium
          python3 -m http.server 8000 >/tmp/ardua-http.log 2>&1 &
          python3 - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC

          options=webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=430,932')
          driver=webdriver.Chrome(options=options)
          try:
              driver.get('http://127.0.0.1:8000/#editor')
              wait=WebDriverWait(driver,15)
              card=wait.until(EC.presence_of_element_located((By.CSS_SELECTOR,'#catalog .el-card')))
              driver.execute_script("arguments[0].dispatchEvent(new PointerEvent('pointerup',{bubbles:true,pointerId:1,pointerType:'touch',isPrimary:true}));",card)
              detail=wait.until(lambda d: d.find_element(By.ID,'elementDiscoveryDetail') if d.find_element(By.ID,'elementDiscoveryDetail').get_attribute('data-open')=='1' and d.find_element(By.ID,'elementDiscoveryDetail').get_attribute('hidden') is None else False)
              body=driver.find_element(By.ID,'elementDiscoveryBody')
              wait.until(lambda d: len(body.get_attribute('innerHTML'))>80)
              print('Browser smoke OK: touch pointerup opens populated element detail.')
          finally:
              driver.quit()
          PY

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-element-detail-open-robust.yml scripts/_patch_element_detail_open_robust.mjs
          git add assets/js/campaign-discoveries-elements.js index.html scripts/validate-instant-discovery-details.js
          git commit -m "Fix element discovery detail opening on touch"
          git push origin HEAD:fix/element-detail-open-robust
