name: Fix discovery inbox workflow

on:
  push:
    branches: ["feat/discovery-unread-flow"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/discovery-unread-flow
      - name: Fix validator token
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/implement-discovery-inbox.yml')
          s=p.read_text()
          old="'data-unread-count'"
          new="'dataset.unreadCount'"
          if old not in s: raise SystemExit('validator token already missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Persist workflow correction
        run: |
          rm .github/workflows/fix-discovery-inbox-workflow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fix discovery inbox validator"
          git push origin HEAD:feat/discovery-unread-flow
