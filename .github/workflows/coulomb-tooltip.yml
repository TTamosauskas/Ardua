name: Fix Coulomb tooltip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coulomb-tooltip.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Coulomb tooltip
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('assets/js/ardua.js')
          s=path.read_text()
          old="coulomb:{title:'BARREIRA DE COULOMB',text:'No jogo: núcleo e camada 1 são livres; camada 2 bloqueia 50%, camada 3 bloqueia 60% e camada 4 bloqueia 80%. H, ²H e ³H são isentos.'}"
          new="coulomb:{title:'BARREIRA DE COULOMB',text:'Aproxime os átomos do núcleo estelar para diminuir a resistência.'}"
          count=s.count(old)
          if count!=1:
              raise SystemExit(f'expected exactly one Coulomb tooltip, found {count}')
          path.write_text(s.replace(old,new))
          PY
          node --check assets/js/ardua.js
          node tests/validate-static.js
      - name: Commit clean implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/coulomb-tooltip.yml
          git add assets/js/ardua.js tests/validate-static.js .github
          git commit -m "Fix Coulomb barrier tooltip text"
          git push
