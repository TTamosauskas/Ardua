name: Patch custom discovery images

on:
  push:
    branches:
      - perf/instant-discovery-details

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/instant-discovery-details
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/_patch_custom_discovery_images.py
      - name: Validate patch
        run: |
          node --check assets/js/campaign-discoveries-phenomena.js
          node scripts/validate-instant-discovery-details.js
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-menu-discoveries-ux.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-custom-discovery-images.yml scripts/_patch_custom_discovery_images.py
          git add assets/js/campaign-discoveries-phenomena.js scripts/validate-instant-discovery-details.js
          git commit -m "Use local images for custom discovery details"
          git push origin HEAD:perf/instant-discovery-details
