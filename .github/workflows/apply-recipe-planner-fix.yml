name: Apply recipe planner fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-recipe-planner-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Patch planner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/ardua.js')
          s=p.read_text()
          def once(old,new,label):
              global s
              count=s.count(old)
              if count!=1: raise SystemExit(f'{label}: esperava 1 ocorrência, encontrei {count}')
              s=s.replace(old,new,1)
          once("if((available[need]||0)>=(needs[need]||0)&&action.kind!=='fusion')continue;","if((available[need]||0)>=(needs[need]||0))continue;",'recursão por símbolo')
          once("if(need.historical&&need.present>0&&!need.missing)continue;","if(need.present>0&&!need.missing)continue;",'nextExecutableFusionToward')
          once("if(item.historical&&item.present>0&&!item.missing)continue;","if(item.present>0&&!item.missing)continue;",'nextActionableRecipeToward')
          once("const available=boardSymbolCounts(),need=counts(r.ing),historical=exactHistoricalSymbols(s),items=","const available=guidanceBoardSymbolCounts(),need=counts(r.ing),historical=exactHistoricalSymbols(s),items=",'contagem espacial')
          once("if(hasRecipeIngredients(r))return{kind:'fusion',recipe:r,out:r.out,needs:[...r.ing],key:`f:${recipeKey(r)}`};","if(hasRecipeIngredients(r,guidanceBoardSymbolCounts()))return{kind:'fusion',recipe:r,out:r.out,needs:[...r.ing],key:`f:${recipeKey(r)}`};",'ingredientes executáveis')
          old="function nextActionableRecipeToward(r,s=phase(),seen=new Set()){\n if(!r)return null;const key=recipeKey(r);if(seen.has(key))return null;seen.add(key);\n if(reactionIsActionable(r,s))return r;\n const needs=orderedSpatialNeeds(r,s);"
          new="function nextActionableRecipeToward(r,s=phase(),seen=new Set()){\n if(!r)return null;const key=recipeKey(r);if(seen.has(key))return null;seen.add(key);\n if(reactionIsActionable(r,s))return r;\n // Se todos os ingredientes já existem, distância espacial pede movimentação, não fabricação de cópias.\n if(hasRecipeIngredients(r,guidanceBoardSymbolCounts()))return r;\n const needs=orderedSpatialNeeds(r,s);"
          once(old,new,'bloco nextActionableRecipeToward')
          old=" // Ingredientes realmente ausentes vêm primeiro. Quando todos existem mas estão distantes,\n // prefira reconstruir o reagente mais leve/reutilizável. Um reagente histórico presente\n // nunca é tratado como ausente só por estar longe."
          new=" // Ingredientes realmente ausentes vêm primeiro. Ingredientes já suficientes no campo\n // são satisfeitos mesmo quando estão distantes: nesse caso o próximo passo é movimentá-los,\n // nunca fabricar uma cópia apenas para corrigir a geometria."
          once(old,new,'comentário orderedSpatialNeeds')
          old="  // Elementos já forjados nunca são reescritos para fabricar uma oportunidade artificial.\n  // A reação-base da cadeia próton-próton é H + H → D; dela o jogador reconstrói ³He e He.\n  const basic=FUSIONS.D;"
          new="  // Elementos já forjados nunca são reescritos para fabricar uma oportunidade artificial.\n  // Só reponha H para H+H→D quando o planejador concluiu que D é realmente o próximo\n  // precursor ausente. Se um intermediário suficiente já existe, preserve-o e deixe o\n  // jogador aproximar/usar a matéria que já está na estrela.\n  const targetOpportunity=phaseFusionRecipes(s).slice().reverse()[0]||phaseFusionRecipe(s);\n  const plannedOpportunity=targetOpportunity?nextExecutableFusionToward(targetOpportunity,s):null;\n  const deuteriumFallbackNeeded=plannedOpportunity?.kind==='fusion'&&plannedOpportunity.recipe===FUSIONS.D;\n  if(!deuteriumFallbackNeeded)return true;\n  const basic=FUSIONS.D;"
          once(old,new,'fallback H+H→D')
          p.write_text(s)
          PY
      - name: Validate patch
        run: |
          node --check assets/js/ardua.js
          node scripts/validate-recipe-planner.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-beta-parallel.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-stellar-plasma.js
          node scripts/validate-rotation-option.js
          node scripts/validate-recipe-audio-cadence.js
      - name: Commit runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: prefer existing recipe intermediates"
          git push origin HEAD:main
