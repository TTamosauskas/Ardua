name: Apply formation 37 hydrogen pairs
on:
  push:
    branches:
      - feat/formation-37-hydrogen-pairs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/patch-formation-37-hydrogen-pairs.js
      - name: Validate syntax
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate formation invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const js=fs.readFileSync('assets/js/ardua.js','utf8');
          const css=fs.readFileSync('assets/css/stellar-formation.css','utf8');
          const must=(ok,msg)=>{if(!ok)throw new Error(msg)};
          must(js.includes("const STELLAR_FORMATION_PAIR_COUNT=18;"),'18 pairs missing');
          must(js.includes("const STELLAR_FORMATION_TOTAL=STELLAR_FORMATION_PAIR_COUNT*2+1;"),'37 total formula missing');
          must(js.includes("const STELLAR_FORMATION_INITIAL_GROUPS=STELLAR_FORMATION_PAIR_COUNT+1;"),'19 seed groups missing');
          must(js.includes("target:37,visual:'nebula'"),'phase target is not 37');
          must(js.includes("menuTag:'37 H'"),'menu tag missing');
          must(js.includes("if(s.mode==='stellarFormation')return 3;"),'formation radius is not 3');
          must(js.includes("if(s.mode==='stellarFormation')return {r:3,factor:.94,max:540};"),'formation geometry is not radius 3');
          const block=js.slice(js.indexOf('function stellarFormationCells(){'),js.indexOf('function stellarFormationLayout(n){'));
          must(block.includes('for(let ring=1;ring<=3;ring++){'),'formation cells do not stop at ring 3');
          must(js.includes("const seedCounts=[...Array(STELLAR_FORMATION_PAIR_COUNT).fill(2),1]"),'18 pairs + singleton seed missing');
          must(js.includes("atom={id,sym:'H',groupId:gid"),'formation atoms are not literal H');
          must(js.includes("function stellarFormationSeedBondDistance()"),'pair bond spacing helper missing');
          must(js.includes("g.x=starSize()/2;g.y=starSize()/2;g.angle=0;f.stabilizing=false;f.complete=true"),'final group is not centered exactly');
          must(css.includes('18 H-H pairs + 1 isolated H'),'formation CSS description stale');
          must(css.includes('width:clamp(30px,8vw,42px);height:clamp(30px,8vw,42px)'),'pair atom scale missing');
          must(css.includes('.stellar-formation-layer.complete .formation-atom{width:var(--cellSize);height:var(--cellSize);'),'final stellar cell scale missing');
          for(const stale of ['61 átomos primordiais em formação estelar','Reúna os 61 átomos primordiais','Os 61 átomos formam um único aglomerado','STELLAR_FORMATION_TOTAL=61','STELLAR_FORMATION_COMPOSITION'])must(!js.includes(stale),'stale formation text: '+stale);
          console.log('formation 37H invariants ok');
          NODE
      - name: Commit product change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ardua.js assets/css/stellar-formation.css
          git commit -m "Refaz formação da Primeira Geração com 37 H" || exit 0
          git push
