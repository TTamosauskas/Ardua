name: Apply Big Bang music and notification UX

on:
  push:
    branches: [main]
    paths:
      - '.github/bigbang-musical-and-notifications.py'
      - '.github/workflows/apply-bigbang-musical-notifications.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compile migration source
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/bigbang-musical-and-notifications.py').read_text()
          compile(src,'.github/bigbang-musical-and-notifications.py','exec')
          print('migration syntax ok')
          PY
      - name: Apply migration
        run: python .github/bigbang-musical-and-notifications.py
      - name: Validate JavaScript
        run: node --check assets/js/ardua.js
      - name: Validate Ardua
        run: node tests/validate-static.js
      - name: Remove staging files
        run: |
          rm .github/bigbang-musical-and-notifications.py
          rm .github/workflows/apply-bigbang-musical-notifications.yml
      - name: Verify staging cleanup
        run: |
          test ! -e .github/bigbang-musical-and-notifications.py
          test ! -e .github/workflows/apply-bigbang-musical-notifications.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Big Bang music and scientific notifications'
          git push
