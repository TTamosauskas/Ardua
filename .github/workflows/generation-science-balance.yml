name: Validate generation science balance
on:
  push:
    branches: [feat/generation-science-balance]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/generation-science-balance
          fetch-depth: 0
      - name: Apply campaign rebalance patch
        run: node scripts/patch-generation-science-balance.js
      - name: Syntax checks
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-supergiants-map.js
          node --check assets/js/campaign-generations.js
          node --check assets/js/campaign-generations-map.js
          node --check assets/js/campaign-mode.js
      - name: Validate cumulative recipes
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate generation invariants
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          function evalGraph(src){const ctx={window:{}};vm.createContext(ctx);vm.runInContext(src,ctx);return ctx.window.ARDUA_CAMPAIGN_GRAPH}
          const current=evalGraph(fs.readFileSync('assets/js/campaign-graph.js','utf8'));
          const previous=evalGraph(cp.execFileSync('git',['show','origin/main:assets/js/campaign-graph.js'],{encoding:'utf8'}));
          if(current.version!==4)throw new Error('graph version 4 missing');
          const oldIds=new Set(previous.baseOrder),newIds=new Set(current.baseOrder);
          for(const id of oldIds)if(!newIds.has(id))throw new Error('phase removed: '+id);
          const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          if(!eq(current.prerequisites.weak_s_cu.allOf,['co','second_birth']))throw new Error('weak-s must begin in Second Generation');
          if(!eq(current.prerequisites.neutronize.allOf,['co']))throw new Error('First Generation collapse still depends on weak-s');
          if(!eq(current.prerequisites.gamma_process.allOf,['final_collapse','second_birth']))throw new Error('gamma-process second-generation gate missing');
          if(!eq(current.prerequisites.second_enrichment.allOf,['second_birth','bi']))throw new Error('main s-process must close Second Generation');
          if(!eq(current.prerequisites.binary_neutron_stars.allOf,['neutron_star','third_birth']))throw new Error('compact binary must begin in Third Generation');
          const known=new Set([...current.baseOrder,...current.atlas.map(x=>x.id),'quasar']);
          for(const [id,rule] of Object.entries(current.prerequisites))for(const p of [...(rule.allOf||[]),...(rule.anyOf||[]).flat()])if(!known.has(p))throw new Error(`unknown prerequisite ${p} for ${id}`);
          const visiting=new Set(),visited=new Set();
          function walk(id){if(visited.has(id))return;if(visiting.has(id))throw new Error('prerequisite cycle at '+id);visiting.add(id);const r=current.prerequisites[id]||{};for(const p of r.allOf||[])walk(p);for(const group of r.anyOf||[])for(const p of group)walk(p);visiting.delete(id);visited.add(id)}
          for(const id of Object.keys(current.prerequisites))walk(id);
          const ctx={window:{ARDUA_CAMPAIGN_GRAPH:current}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('assets/js/campaign-generations.js','utf8'),ctx);const gen=ctx.window.ARDUA_GENERATIONS;
          for(const id of current.sequences.weakS)if(gen.generationOf(id)!=='second')throw new Error(id+' not in Second Generation');
          if(gen.generationOf('gamma_process')!=='second')throw new Error('gamma_process not second');
          for(const id of ['binary_neutron_stars','kilonova','eu','u','decay_at','rp_cu'])if(gen.generationOf(id)!=='third')throw new Error(id+' not third');
          for(const id of ['white','neutron_star','black_hole'])if(gen.generationOf(id)!==null||gen.roleOf(id)!=='remnant')throw new Error(id+' must be generation-neutral remnant');
          NODE
      - name: Validate map and engine semantics
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const map=fs.readFileSync('assets/js/campaign-map.js','utf8');
          const engine=fs.readFileSync('assets/js/ardua.js','utf8');
          const mode=fs.readFileSync('assets/js/campaign-mode.js','utf8');
          const sg=fs.readFileSync('assets/js/campaign-supergiants-map.js','utf8');
          if(!map.includes("branchCluster('secondgen'"))throw new Error('Second Generation hub missing');
          if(!map.includes("'s-second':xseq(G.sequences.sprocess)"))throw new Error('Second Generation AGB portal missing');
          const highLine=map.split("{key:'high',label:'Alta massa'")[1]?.split("],'stellar-branches')")[0]||'';
          if(highLine.includes("portal('Processo-s fraco'"))throw new Error('weak-s still inside First Generation high-mass branch');
          const supernovaBlock=map.split("const supernova=branchCluster('supernova'")[1]?.split("],'supernova-branches')")[0]||'';
          if(supernovaBlock.includes("key:'gamma'"))throw new Error('gamma still presented as First Generation supernova branch');
          if(!map.includes("class=\"third-generation-zone\""))throw new Error('Third Generation zone missing');
          if(sg.includes('const weakPortal='))throw new Error('supergiant adapter still requires weak-s portal');
          if(!engine.includes("Segunda Geração · supernova enriquecida · γ-processo"))throw new Error('gamma engine copy missing');
          if(!engine.includes("Terceira Geração · Sistemas compactos"))throw new Error('binary engine copy missing');
          const mature=engine.match(/^ mature:\[(.*)$/m)?.[1]||'';
          for(const sym of ["'Eu'","'Au'","'Th'","'U'"])if(mature.includes(sym))throw new Error('Third Generation birth still inherits r-process '+sym);
          for(const sym of ["'Sr'","'Ba'","'Pb'","'Bi'"])if(!mature.includes(sym))throw new Error('Third Generation birth missing s-process '+sym);
          if(!mode.includes('version:6'))throw new Error('save version 6 missing');
          const secondProducts=mode.match(/const SECOND_GENERATION_PRODUCTS=\[(.*?)\];/)?.[1]||'';
          if(secondProducts.includes("'Eu'")||secondProducts.includes("'U'"))throw new Error('r-process still inherited before Third Generation');
          for(const sym of ["'Cu'","'Kr'","'Sr'","'Bi'"])if(!secondProducts.includes(sym))throw new Error('Second Generation heritage missing '+sym);
          NODE
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ardua.js assets/js/campaign-graph.js assets/js/campaign-map.js assets/js/campaign-supergiants-map.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: rebalance stellar generations by enrichment"
          git push origin HEAD:feat/generation-science-balance
