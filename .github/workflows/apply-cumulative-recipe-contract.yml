name: Apply cumulative recipe contract

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-cumulative-recipe-contract.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Apply cumulative recipe contract
        run: node scripts/apply-cumulative-recipe-contract.js
      - name: Validate patched engine anchors
        run: |
          grep -q "function cumulativeFusionTapAvailable" assets/js/ardua.js
          grep -q "s.mode==='stellarFormation'||s.mode==='campaignMilestone'" assets/js/ardua.js
          grep -q "Memória cumulativa" assets/js/ardua.js
      - name: Commit engine migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git rm .github/workflows/apply-cumulative-recipe-contract.yml scripts/apply-cumulative-recipe-contract.js
          git commit -m "Garante execucao cumulativa das receitas aprendidas"
          git push origin HEAD:main
