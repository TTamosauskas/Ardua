name: Apply thermal ionization implementation

on:
  push:
    branches: ["feature/thermal-ionization"]
    paths:
      - "scripts/apply-thermal-ionization.mjs"
      - ".github/workflows/apply-thermal-ionization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/thermal-ionization
          fetch-depth: 0

      - name: Normalize patch runner
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/apply-thermal-ionization.mjs';
          let s=fs.readFileSync(p,'utf8');
          const graphA=`  s=replaceOnce(s,'"solar_wind","stellar_ionization","stellar_recombination"','"solar_wind","stellar_ionization","thermal_ionization","stellar_recombination"','graph base order');\n  s=replaceOnce(s,'"solar_wind","stellar_ionization","stellar_recombination"','"solar_wind","stellar_ionization","thermal_ionization","stellar_recombination"','graph red sequence');`;
          const graphB=`  const plasmaOrder='"solar_wind","stellar_ionization","stellar_recombination"',withThermal='"solar_wind","stellar_ionization","thermal_ionization","stellar_recombination"';\n  const plasmaOrderCount=s.split(plasmaOrder).length-1;if(plasmaOrderCount!==2)throw new Error(\`Expected 2 plasma order anchors, got \${plasmaOrderCount}\`);s=s.replaceAll(plasmaOrder,withThermal);`;
          if(!s.includes(graphA))throw new Error('graph normalization anchor missing');
          s=s.replace(graphA,graphB);
          const classA=`  s=replaceOnce(s,"'solar_wind','stellar_ionization','stellar_recombination','coulomb_intro','stellar_convection'","'solar_wind','stellar_ionization','thermal_ionization','stellar_recombination','coulomb_intro','stellar_convection'",'thermal short duration');`;
          const classB=`  {const from="'solar_wind','stellar_ionization','stellar_recombination','coulomb_intro','stellar_convection'",to="'solar_wind','stellar_ionization','thermal_ionization','stellar_recombination','coulomb_intro','stellar_convection'",count=s.split(from).length-1;if(count!==2)throw new Error(\`Expected 2 thermal classification anchors, got \${count}\`);s=s.replaceAll(from,to);}`;
          if(!s.includes(classA))throw new Error('classification normalization anchor missing');
          s=s.replace(classA,classB);
          const validatorA="engine.includes('Ionize átomos no núcleo ${state.thermalIonizations}/${s.target}')";
          const validatorB="engine.includes('Ionize átomos no núcleo \\${state.thermalIonizations}/\\${s.target}')";
          if(!s.includes(validatorA))throw new Error('validator interpolation anchor missing');
          fs.writeFileSync(p,s.replace(validatorA,validatorB));
          NODE

      - name: Apply implementation
        run: node scripts/apply-thermal-ionization.mjs

      - name: Align neighboring regression contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          let p='scripts/validate-movement-chain-particles.js',s=fs.readFileSync(p,'utf8');
          if(!s.includes("campaign.includes('version:14')"))throw new Error('movement migration version anchor missing');
          s=s.replace("campaign.includes('version:14')","campaign.includes('version:15')")
             .replace('Anã Branca deve esperar o trio de plasma','Anã Branca deve esperar a sequência de plasma');
          fs.writeFileSync(p,s);

          p='scripts/validate-coronal-jets.js';s=fs.readFileSync(p,'utf8');
          if(!s.includes("need(campaign,'version:14'"))throw new Error('coronal migration version anchor missing');
          s=s.replace("need(campaign,'version:14','Migração de campanha v14 ausente');","need(campaign,'version:15','Migração de campanha v15 ausente');");
          fs.writeFileSync(p,s);

          p='scripts/validate-cumulative-recipes.js';s=fs.readFileSync(p,'utf8');
          const oldGate="if(JSON.stringify(G.prerequisites.stellar_recombination)!==JSON.stringify({allOf:['stellar_ionization']}))fail('Recombinação Estelar deve seguir Ionização Estelar');";
          const newGate="if(JSON.stringify(G.prerequisites.thermal_ionization)!==JSON.stringify({allOf:['stellar_ionization']}))fail('Ionização Térmica deve seguir Ionização Estelar');\nif(JSON.stringify(G.prerequisites.stellar_recombination)!==JSON.stringify({allOf:['thermal_ionization']}))fail('Recombinação Estelar deve seguir Ionização Térmica');";
          if(!s.includes(oldGate))throw new Error('cumulative thermal prerequisite anchor missing');
          fs.writeFileSync(p,s.replace(oldGate,newGate));

          p='scripts/validate-phenomenon-sources.mjs';s=fs.readFileSync(p,'utf8');
          if(!s.includes('entries.length!==54'))throw new Error('phenomenon count anchor missing');
          s=s.replace('entries.length!==54','entries.length!==55').replace('Esperados 54 fenômenos','Esperados 55 fenômenos');
          fs.writeFileSync(p,s);
          NODE

      - name: Restore patch runner
        if: always()
        run: git checkout -- scripts/apply-thermal-ionization.mjs

      - name: Check syntax
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/rotation-polish.js
          node --check assets/js/audio-polish.js
          node --check assets/js/recipe-audio-sync.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-fork-links.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-exploration.js
          node --check assets/js/campaign-runtime-sync.js
          node --check assets/js/campaign-giants-map.js
          node --check assets/js/campaign-phase-modal.js
          node --check assets/js/phase-polish.js
          node --check assets/js/campaign-home-polish.js
          node --check assets/js/campaign-discoveries-elements.js
          node --check assets/js/campaign-element-bohr.js
          node --check assets/js/campaign-discoveries-phenomena.js
          node --check assets/js/campaign-discovery-notifications.js
          node --check assets/js/campaign-quarks-graph.js
          node --check assets/js/campaign-quarks.js
          node --check assets/js/campaign-quarks-chrome.js
          node --check assets/js/campaign-quarks-map.js
          node --check assets/js/campaign-quarks-discoveries.js

      - name: Validate thermal ionization
        run: node scripts/validate-thermal-ionization.js

      - name: Validate Pages regression suite
        run: |
          node scripts/validate-element-sources.mjs
          node scripts/validate-element-bohr.js
          node scripts/validate-phenomenon-sources.mjs
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-stellar-plasma.js
          node scripts/validate-coronal-jets.js
          node scripts/validate-convection-regression.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-recipe-planner.js
          node scripts/validate-beta-parallel.js
          node scripts/validate-rotation-option.js
          node scripts/validate-recipe-audio-cadence.js
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-discovery-inbox.js
          node scripts/validate-campaign-phase-flow.js
          node scripts/validate-campaign-runtime-regressions.js
          node scripts/validate-quarks-phase.js
          node scripts/validate-quarks-chrome.js

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/pages.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Implement thermal ionization phase"
          git push origin HEAD:feature/thermal-ionization
