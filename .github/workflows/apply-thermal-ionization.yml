name: Apply thermal ionization implementation

on:
  push:
    branches: ["feature/thermal-ionization"]
    paths:
      - "scripts/apply-thermal-ionization.mjs"
      - ".github/workflows/apply-thermal-ionization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/thermal-ionization
          fetch-depth: 0

      - name: Normalize patch runner
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/apply-thermal-ionization.mjs';
          let s=fs.readFileSync(p,'utf8');
          const a=`  s=replaceOnce(s,'"solar_wind","stellar_ionization","stellar_recombination"','"solar_wind","stellar_ionization","thermal_ionization","stellar_recombination"','graph base order');\n  s=replaceOnce(s,'"solar_wind","stellar_ionization","stellar_recombination"','"solar_wind","stellar_ionization","thermal_ionization","stellar_recombination"','graph red sequence');`;
          const b=`  const plasmaOrder='"solar_wind","stellar_ionization","stellar_recombination"',withThermal='"solar_wind","stellar_ionization","thermal_ionization","stellar_recombination"';\n  const plasmaOrderCount=s.split(plasmaOrder).length-1;if(plasmaOrderCount!==2)throw new Error(\`Expected 2 plasma order anchors, got \${plasmaOrderCount}\`);s=s.replaceAll(plasmaOrder,withThermal);`;
          if(!s.includes(a))throw new Error('graph normalization anchor missing');
          fs.writeFileSync(p,s.replace(a,b));
          NODE

      - name: Apply implementation
        run: node scripts/apply-thermal-ionization.mjs

      - name: Restore patch runner
        run: git checkout -- scripts/apply-thermal-ionization.mjs

      - name: Check syntax
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-phase-names.js
          node --check assets/js/campaign-discoveries.js
          node --check assets/js/campaign-discoveries-phenomena.js

      - name: Validate thermal ionization
        run: node scripts/validate-thermal-ionization.js

      - name: Validate plasma and neighboring mechanics
        run: |
          node scripts/validate-stellar-plasma.js
          node scripts/validate-convection-regression.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-campaign-phase-flow.js
          node scripts/validate-campaign-runtime-regressions.js
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-phenomenon-sources.mjs
          node tests/validate-static.js

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Implement thermal ionization phase"
          git push origin HEAD:feature/thermal-ionization
