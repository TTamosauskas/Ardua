name: Apply beta guidance availability correction

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-beta-guidance-availability.py"
      - ".github/workflows/apply-beta-guidance-availability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Apply guidance availability fix
        run: python scripts/apply-beta-guidance-availability.py
      - name: Check engine syntax
        run: node --check assets/js/ardua.js
      - name: Smoke-check guidance fix
        run: |
          grep -q "function guidanceBoardSymbolCounts" assets/js/ardua.js
          grep -q "if(p.neutronBetaPending)return" assets/js/ardua.js
          grep -q "available=guidanceBoardSymbolCounts()" assets/js/ardua.js
      - name: Commit corrected runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git diff --cached --quiet || git commit -m "fix: ignore beta-pending nuclei in recipe guidance"
          git push
