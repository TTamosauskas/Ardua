name: Inspect recipe planner

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-recipe-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Print planner snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text()
          needles=[
            "function nextExecutableFusionToward",
            "action.kind!=='fusion'",
            "function ensureOpportunity",
            "fuseHydrogenWithProton",
            "Hidrogênio + próton",
          ]
          for needle in needles:
              i=s.find(needle)
              print('\n===== ',needle,' @ ',i,' =====')
              if i>=0: print(s[max(0,i-1800):i+4200])
          PY
