name: Inspect recipe planner

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-recipe-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Print planner snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text()
          start=s.find('function ensureOpportunity(){')
          end=s.find('\nfunction ',start+30)
          print('===== ensureOpportunity full =====')
          print(s[start:end if end>start else start+18000])
          for needle in ['function orderedSpatialNeeds','function conciseRecipeLine','function guidanceBoardSymbolCounts']:
              i=s.find(needle)
              print('\n===== ',needle,' @ ',i,' =====')
              if i>=0: print(s[max(0,i-1200):i+5000])
          PY
