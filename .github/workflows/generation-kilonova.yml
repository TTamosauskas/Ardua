name: Build kilonova generation refinement
on:
  push:
    branches: [feat/generation-kilonova]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/generation-kilonova
          fetch-depth: 0
      - name: Apply kilonova refinement
        run: node scripts/patch-generation-kilonova.js
      - name: Validate staged graph
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-giants-map.js
          node --check assets/js/campaign-generations.js
          node scripts/validate-cumulative-recipes.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),cp=require('child_process');
          function graphFrom(code){const box={window:{}};vm.runInNewContext(code,box);return box.window.ARDUA_CAMPAIGN_GRAPH}
          const before=graphFrom(cp.execFileSync('git',['show','origin/feat/generation-enrichment:assets/js/campaign-graph.js'],{encoding:'utf8'}));
          const after=graphFrom(fs.readFileSync('assets/js/campaign-graph.js','utf8'));
          const missing=before.baseOrder.filter(id=>!after.baseOrder.includes(id));if(missing.length)throw new Error('existing phases removed: '+missing.join(','));
          for(const id of ['binary_neutron_stars','kilonova'])if(!after.baseOrder.includes(id))throw new Error('missing '+id);
          if(JSON.stringify(after.prerequisites.eu)!==JSON.stringify({allOf:['kilonova']}))throw new Error('r-process must begin after kilonova');
          if(JSON.stringify(after.prerequisites.kilonova)!==JSON.stringify({allOf:['binary_neutron_stars']}))throw new Error('kilonova gate wrong');
          const game=fs.readFileSync('assets/js/ardua.js','utf8');
          for(const id of ['binary_neutron_stars','kilonova'])if(!game.includes(`id:'${id}'`))throw new Error('engine missing '+id);
          const mode=fs.readFileSync('assets/js/campaign-mode.js','utf8');if(!mode.includes('version:4')||!mode.includes("'binary_neutron_stars','kilonova'"))throw new Error('v4 migration missing');
          const map=fs.readFileSync('assets/js/campaign-map.js','utf8');if(map.includes("structural('Sistema binário de estrelas de nêutrons'"))throw new Error('old structural binary label remains');
          const giants=fs.readFileSync('assets/js/campaign-giants-map.js','utf8');if(!giants.includes('Nova estrela AGB')||!giants.includes('2ª GERAÇÃO'))throw new Error('AGB generation bridge missing');
          NODE
      - name: Commit generated refinement
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ardua.js assets/js/campaign-graph.js assets/js/campaign-map.js assets/js/campaign-giants-map.js assets/css/campaign-generations.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: promote kilonova and clarify second-generation AGB path"
          git push origin HEAD:feat/generation-kilonova
