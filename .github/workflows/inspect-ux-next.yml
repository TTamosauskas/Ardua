name: Inspect next campaign UX

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/inspect-ux-next.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect completion HUD and geometry anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('assets/js/ardua.js').read_text(encoding='utf-8')
          css=Path('assets/css/ardua.css').read_text(encoding='utf-8')
          def show(label,needle,before=1000,after=6500,src=s):
            i=src.find(needle)
            print(f'\n===== {label} :: {needle} @ {i} =====')
            if i>=0: print(src[max(0,i-before):min(len(src),i+after)])
          for label,needle,b,a in [
            ('ADVANCE','function advancePhase',1800,9000),
            ('SCATTER','async function scatterStage',1200,11000),
            ('END BUTTON',"$('phaseEndBtn').addEventListener",2200,9000),
            ('END BUTTON ALT','phaseEndBtn',800,10000),
            ('HUD','function updateHUD',1600,12000),
            ('OBJECTIVE SAT','function objectiveSatisfied',1200,7000),
            ('START PHASE','function startPhase',1800,14000),
            ('CAMPAIGN KNOW','function campaignKnowledgeReached',1200,6000),
            ('PHASE RADIUS','function phaseRadius',1000,6000),
            ('ACTIVE SET','function activeSet',800,5000),
            ('RENDER','function render()',900,7000),
            ('VISUAL','function applyVisual',900,8000),
          ]: show(label,needle,b,a)
          for needle in ['.atom{','.atom {','.atom,','.atom.atomic-piece','transition:left','transition: left']:
            show('CSS ATOM',needle,600,3500,css)
          PY
