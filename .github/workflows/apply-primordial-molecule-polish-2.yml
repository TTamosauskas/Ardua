name: Apply primordial molecule polish 2
on:
  push:
    branches:
      - fix/primordial-molecule-polish-2
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply molecule polish
        run: node scripts/patch-primordial-molecule-polish-2.js
      - name: Syntax checks
        run: |
          node --check assets/js/ardua.js
          node --check scripts/patch-primordial-molecule-polish-2.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate requested invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('assets/js/ardua.js','utf8');
          const must=[
            "first_atomic_bonds',branch:'Química primordial · primeiras ligações',title:'Primeiras Ligações Atômicas',meta:'He + H → HeH⁺',new:'HeH+',mode:'primordialMolecule',target:4",
            "first_nebulae',branch:'Química primordial · primeiras nebulosas',title:'Primeiras Nebulosas',meta:'HeH⁺ + H → H₂',new:'H2',mode:'primordialMolecule',target:4",
            "s.mode==='atomicRecombination'||s.mode==='primordialMolecule'",
            "parseFloat(getComputedStyle(el).width)",
            "preparePrimordialMoleculeFormationMotif('HeH+'",
            "preparePrimordialMoleculeFormationMotif('H2'",
            "const motif=moleculePhase?null:await objectiveInteractionPrelude",
            "const motif=!moleculePhase&&objectiveNeutral?await objectiveInteractionPrelude",
            "if(primordialNeutronsStable()){n.unstable=false;n.lifetimeRounds=null"
          ];
          for(const x of must)if(!s.includes(x))throw new Error('missing invariant: '+x);
          if(s.includes("primordialMoleculeBondDistance(){return Math.max(32,Math.min(40"))throw new Error('old overlapping spacing remains');
          NODE
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/ardua.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refina duplas moleculares [skip ci]'
          git push
