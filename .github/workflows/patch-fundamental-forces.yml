name: Patch fundamental-force discoveries

on:
  push:
    branches:
      - feat/fundamental-forces-discoveries

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fundamental-forces-discoveries
          fetch-depth: 0
      - name: Apply discovery updates
        run: |
          python - <<'PY'
          from pathlib import Path

          # Load the force catalog before the detail renderer and unread inbox.
          p=Path('index.html'); text=p.read_text()
          anchor='<script src="assets/js/campaign-quarks-discoveries.js"></script>\n'
          add=anchor+'<script src="assets/js/campaign-fundamental-forces.js"></script>\n'
          if 'campaign-fundamental-forces.js' not in text:
              if anchor not in text: raise SystemExit('index anchor missing')
              text=text.replace(anchor,add,1)
          p.write_text(text)

          # Universe banner copy.
          p=Path('assets/js/campaign-preamble-map.js'); text=p.read_text()
          old='Do plasma quente aos primeiros átomos, gases e objetos subestelares.'
          new='Do plasma quente aos primeiros corpos celestes.'
          if old not in text and new not in text: raise SystemExit('preamble copy missing')
          text=text.replace(old,new)
          p.write_text(text)

          # Elements are collection-driven, not phase-completion-driven.
          p=Path('assets/js/campaign-discoveries-elements.js'); text=p.read_text()
          start=text.index('let creationGateSerial=0;')
          end=text.index('\nfunction enforceTwoTabs(){',start)
          replacement="""const ELEMENT_DISCOVERY_ALIASES=Object.freeze({D:'H',T:'H',He3:'He',HeU:'He',Be7:'Be',Be8:'Be',C13:'C',Ne22:'Ne',FeU:'Fe'});\nfunction discoveredElementSymbols(){\n let data={};try{data=JSON.parse(localStorage.getItem('stellarForgeV1013')||'{}')||{}}catch(_e){}\n const found=new Set();for(const raw of data.discovered||[]){const sym=ELEMENT_DISCOVERY_ALIASES[raw]||raw;if(sym)found.add(sym)}return found;\n}\nfunction enforceElementCreationGate(){\n if(!modal.classList.contains('discoveries-view'))return;\n const discovered=discoveredElementSymbols(),editor=!!C.editor;let visible=0;\n catalog.querySelectorAll('.el-card').forEach(elementCard=>{\n  const sym=elementCard.querySelector('.s')?.textContent?.trim()||'',show=editor||discovered.has(sym),shouldHide=!show;\n  if(elementCard.hidden!==shouldHide)elementCard.hidden=shouldHide;if(show)visible++;\n });\n const empties=[...catalog.querySelectorAll(':scope > .discovery-empty')];\n if(visible)empties.forEach(el=>el.remove());\n else if(!empties.length){const empty=document.createElement('div');empty.className='discovery-empty';empty.textContent='Elementos descobertos no jogo aparecerão aqui.';catalog.appendChild(empty)}\n}\n"""
          text=text[:start]+replacement+text[end:]
          p.write_text(text)

          # Short local copy and exact Wikipedia destinations; image remains supplied by the same Wikipedia image pipeline as other phenomena.
          p=Path('assets/js/campaign-discoveries-phenomena.js'); text=p.read_text()
          old="""const PHENOMENON_INTRO_HTML_OVERRIDES=Object.freeze({\n 'Ejeção de Massa Coronal':'<p><strong>Ejeções de massa coronal</strong> (<strong>EMC</strong>) são grandes erupções de gás ionizado a alta temperatura, provenientes da coroa solar. O gás expelido constitui parte do vento solar e, quando atinge o campo magnético terrestre, pode causar tempestades geomagnéticas, prejudicando os meios de comunicações e estações elétricas.</p>'\n});"""
          new="""const PHENOMENON_INTRO_HTML_OVERRIDES=Object.freeze({\n 'Ejeção de Massa Coronal':'<p><strong>Ejeções de massa coronal</strong> (<strong>EMC</strong>) são grandes erupções de gás ionizado a alta temperatura, provenientes da coroa solar. O gás expelido constitui parte do vento solar e, quando atinge o campo magnético terrestre, pode causar tempestades geomagnéticas, prejudicando os meios de comunicações e estações elétricas.</p>',\n 'Força Eletromagnética':'<p>A <strong>Força Eletromagnética</strong> atua entre partículas com carga elétrica. Na formação dos primeiros átomos, ela mantém elétrons ligados aos núcleos e torna possível a estrutura atômica e a química.</p>',\n 'Força Gravitacional':'<p>A <strong>Força Gravitacional</strong> atrai matéria. Em escalas astronômicas, ela reúne gás e poeira, comprime nuvens e conduz o nascimento de protoestrelas e outros corpos celestes.</p>',\n 'Força Nuclear Fraca':'<p>A <strong>Força Nuclear Fraca</strong> permite transformações entre partículas. Na cadeia próton-próton, ela converte um próton em nêutron e produz um pósitron e um neutrino.</p>'\n});"""
          if old not in text: raise SystemExit('phenomenon intro override anchor missing')
          text=text.replace(old,new,1)
          alias_anchor=""" 'Big Bang':'Big Bang',\n"""
          alias_add=""" 'Big Bang':'Big Bang',\n 'Força Eletromagnética':'Força eletromagnética',\n 'Força Gravitacional':'Gravidade',\n 'Força Nuclear Fraca':'Interação fraca',\n"""
          if "'Força Eletromagnética':'Força eletromagnética'" not in text:
              if alias_anchor not in text: raise SystemExit('wiki alias anchor missing')
              text=text.replace(alias_anchor,alias_add,1)
          p.write_text(text)

          # Validate the new module in Pages and keep an explicit regression contract.
          p=Path('.github/workflows/pages.yml'); text=p.read_text()
          check='          node --check assets/js/campaign-fundamental-forces.js\n'
          anchor='          node --check assets/js/campaign-quarks-discoveries.js\n'
          if check not in text:
              if anchor not in text: raise SystemExit('pages syntax anchor missing')
              text=text.replace(anchor,anchor+check,1)
          validation="""\n      - name: Validate fundamental forces discoveries\n        run: node scripts/validate-fundamental-forces.js\n"""
          anchor2="""\n      - name: Validate discovery inbox\n        run: node scripts/validate-discovery-inbox.js\n"""
          if 'Validate fundamental forces discoveries' not in text:
              if anchor2 not in text: raise SystemExit('pages validation anchor missing')
              text=text.replace(anchor2,validation+anchor2,1)
          p.write_text(text)

          Path('scripts/validate-fundamental-forces.js').write_text(r"""const fs=require('fs');
const force=fs.readFileSync('assets/js/campaign-fundamental-forces.js','utf8');
const phenomena=fs.readFileSync('assets/js/campaign-discoveries-phenomena.js','utf8');
const elements=fs.readFileSync('assets/js/campaign-discoveries-elements.js','utf8');
const preamble=fs.readFileSync('assets/js/campaign-preamble-map.js','utf8');
const index=fs.readFileSync('index.html','utf8');
const engine=fs.readFileSync('assets/js/ardua.js','utf8');
function assert(ok,msg){if(!ok)throw new Error(msg)}
const specs=[
 ['phenomenon:electromagneticForce','Força Eletromagnética','atomic_he'],
 ['phenomenon:gravitationalForce','Força Gravitacional','brown_formation'],
 ['phenomenon:weakNuclearForce','Força Nuclear Fraca','he_orange']
];
for(const [key,title,phase] of specs){assert(force.includes(key),`${key} ausente`);assert(force.includes(title),`${title} ausente`);assert(force.includes(`phase:'${phase}'`),`${title} ligado à fase errada`)}
assert(force.includes('rewardDiscoveries:[...rewards]'),'Forças precisam entrar no save como descobertas reais');
assert(force.includes('window.ARDUA_PHASE_DISCOVERIES'),'Forças precisam participar do ownership por fase');
assert(index.indexOf('campaign-fundamental-forces.js')>index.indexOf('campaign-quarks-discoveries.js'),'Catálogo de forças precisa vir depois de Quarks');
assert(index.indexOf('campaign-fundamental-forces.js')<index.indexOf('campaign-discovery-notifications.js'),'Catálogo de forças precisa existir antes do inbox');
for(const title of ['Força Eletromagnética','Força Gravitacional','Força Nuclear Fraca'])assert(phenomena.includes(title),`${title} sem detalhe curto`);
for(const target of ["'Força Eletromagnética':'Força eletromagnética'","'Força Gravitacional':'Gravidade'","'Força Nuclear Fraca':'Interação fraca'"])assert(phenomena.includes(target),`Wikipedia alias ausente: ${target}`);
assert(engine.includes("D:{ing:['H','H'],out:'D',emissions:['positron','neutrino'],pp:true}"),'A fase escolhida para a força fraca perdeu a reação p+p do pp-chain');
assert(engine.includes("{id:'he_orange'")&&engine.includes("meta:'Primeiros passos da cadeia próton-próton'"),'A força fraca precisa continuar ancorada na primeira fase explícita da cadeia pp');
assert(elements.includes("data.discovered||[]"),'Elementos precisam depender da coleção realmente descoberta');
assert(elements.includes("Elementos descobertos no jogo aparecerão aqui."),'Estado vazio de Elementos incorreto');
assert(!elements.includes("Os elementos aparecem aqui depois que sua primeira fase de criação é concluída."),'Texto antigo do estado vazio voltou');
assert(preamble.includes('Do plasma quente aos primeiros corpos celestes.'),'Texto do Universo Primordial não foi atualizado');
console.log('Fundamental forces OK: EM@atomic_he, gravity@brown_formation, weak@he_orange; element collection gate and preamble copy verified.');
""")
          PY
      - name: Validate changes
        run: |
          node --check assets/js/campaign-fundamental-forces.js
          node --check assets/js/campaign-discoveries-elements.js
          node --check assets/js/campaign-discoveries-phenomena.js
          node scripts/validate-fundamental-forces.js
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-discovery-inbox.js
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-fundamental-forces.yml
          git add index.html assets/js/campaign-preamble-map.js assets/js/campaign-discoveries-elements.js assets/js/campaign-discoveries-phenomena.js assets/js/campaign-fundamental-forces.js scripts/validate-fundamental-forces.js .github/workflows/pages.yml
          git commit -m "Add remaining fundamental force discoveries"
          git push origin HEAD:feat/fundamental-forces-discoveries
