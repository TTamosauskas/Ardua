name: Patch fundamental-force discoveries

on:
  push:
    branches:
      - feat/fundamental-forces-discoveries

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fundamental-forces-discoveries
          fetch-depth: 0
      - name: Apply discovery updates
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html'); text=p.read_text()
          anchor='<script src="assets/js/campaign-quarks-discoveries.js"></script>\n'
          addition=anchor+'<script src="assets/js/campaign-fundamental-forces.js"></script>\n'
          if 'campaign-fundamental-forces.js' not in text:
              if anchor not in text: raise SystemExit('index anchor missing')
              text=text.replace(anchor,addition,1)
          p.write_text(text)

          p=Path('assets/js/campaign-preamble-map.js'); text=p.read_text()
          old='Do plasma quente aos primeiros átomos, gases e objetos subestelares.'
          new='Do plasma quente aos primeiros corpos celestes.'
          if old not in text and new not in text: raise SystemExit('preamble copy missing')
          p.write_text(text.replace(old,new))

          p=Path('assets/js/campaign-discoveries-elements.js'); text=p.read_text()
          start=text.index('let creationGateSerial=0;')
          end=text.index('\nfunction enforceTwoTabs(){',start)
          lines=[
            "const ELEMENT_DISCOVERY_ALIASES=Object.freeze({D:'H',T:'H',He3:'He',HeU:'He',Be7:'Be',Be8:'Be',C13:'C',Ne22:'Ne',FeU:'Fe'});",
            "function discoveredElementSymbols(){",
            " let data={};try{data=JSON.parse(localStorage.getItem('stellarForgeV1013')||'{}')||{}}catch(_e){}",
            " const found=new Set();for(const raw of data.discovered||[]){const sym=ELEMENT_DISCOVERY_ALIASES[raw]||raw;if(sym)found.add(sym)}return found;",
            "}",
            "function enforceElementCreationGate(){",
            " if(!modal.classList.contains('discoveries-view'))return;",
            " const discovered=discoveredElementSymbols(),editor=!!C.editor;let visible=0;",
            " catalog.querySelectorAll('.el-card').forEach(elementCard=>{",
            "  const sym=elementCard.querySelector('.s')?.textContent?.trim()||'',show=editor||discovered.has(sym),shouldHide=!show;",
            "  if(elementCard.hidden!==shouldHide)elementCard.hidden=shouldHide;if(show)visible++;",
            " });",
            " const empties=[...catalog.querySelectorAll(':scope > .discovery-empty')];",
            " if(visible)empties.forEach(el=>el.remove());",
            " else if(!empties.length){const empty=document.createElement('div');empty.className='discovery-empty';empty.textContent='Elementos descobertos no jogo aparecerão aqui.';catalog.appendChild(empty)}",
            "}",
            ""
          ]
          text=text[:start]+'\n'.join(lines)+text[end:]
          p.write_text(text)

          p=Path('assets/js/campaign-discoveries-phenomena.js'); text=p.read_text()
          if "'Força Eletromagnética':'<p>" not in text:
              start=text.index('const PHENOMENON_INTRO_HTML_OVERRIDES=Object.freeze({')
              end=text.index('\n});',start)
              block=text[start:end]
              block=block.rstrip()+",\n 'Força Eletromagnética':'<p>A <strong>Força Eletromagnética</strong> atua entre partículas com carga elétrica. Na formação dos primeiros átomos, ela mantém elétrons ligados aos núcleos e torna possível a estrutura atômica e a química.</p>',\n 'Força Gravitacional':'<p>A <strong>Força Gravitacional</strong> atrai matéria. Em escalas astronômicas, ela reúne gás e poeira, comprime nuvens e conduz o nascimento de protoestrelas e outros corpos celestes.</p>',\n 'Força Nuclear Fraca':'<p>A <strong>Força Nuclear Fraca</strong> permite transformações entre partículas. Na cadeia próton-próton, ela converte um próton em nêutron e produz um pósitron e um neutrino.</p>'"
              text=text[:start]+block+text[end:]
          alias=" 'Big Bang':'Big Bang',\n"
          add=" 'Big Bang':'Big Bang',\n 'Força Eletromagnética':'Força eletromagnética',\n 'Força Gravitacional':'Gravidade',\n 'Força Nuclear Fraca':'Interação fraca',\n"
          if "'Força Eletromagnética':'Força eletromagnética'" not in text:
              if alias not in text: raise SystemExit('wiki alias anchor missing')
              text=text.replace(alias,add,1)
          p.write_text(text)

          p=Path('.github/workflows/pages.yml'); text=p.read_text()
          syntax='          node --check assets/js/campaign-fundamental-forces.js\n'
          syntax_anchor='          node --check assets/js/campaign-quarks-discoveries.js\n'
          if syntax not in text:
              if syntax_anchor not in text: raise SystemExit('pages syntax anchor missing')
              text=text.replace(syntax_anchor,syntax_anchor+syntax,1)
          validation='\n      - name: Validate fundamental forces discoveries\n        run: node scripts/validate-fundamental-forces.js\n'
          validation_anchor='\n      - name: Validate discovery inbox\n        run: node scripts/validate-discovery-inbox.js\n'
          if 'Validate fundamental forces discoveries' not in text:
              if validation_anchor not in text: raise SystemExit('pages validation anchor missing')
              text=text.replace(validation_anchor,validation+validation_anchor,1)
          p.write_text(text)
          PY
      - name: Validate changes
        run: |
          node --check assets/js/campaign-fundamental-forces.js
          node --check assets/js/campaign-discoveries-elements.js
          node --check assets/js/campaign-discoveries-phenomena.js
          node scripts/validate-fundamental-forces.js
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-discovery-inbox.js
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-fundamental-forces.yml
          git add index.html assets/js/campaign-preamble-map.js assets/js/campaign-discoveries-elements.js assets/js/campaign-discoveries-phenomena.js assets/js/campaign-fundamental-forces.js scripts/validate-fundamental-forces.js .github/workflows/pages.yml
          git commit -m "Add remaining fundamental force discoveries"
          git push origin HEAD:feat/fundamental-forces-discoveries
