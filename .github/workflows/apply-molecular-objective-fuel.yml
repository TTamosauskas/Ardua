name: Apply molecular objective and fuel fix
on:
  push:
    branches:
      - fix/molecular-objective-fuel
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/patch-molecular-objective-fuel.js
      - name: Syntax check
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate requested invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('assets/js/ardua.js','utf8');
          const must=[
            "title:'Primeiras Ligações Atômicas'",
            "new:'HeH+',mode:'primordialMolecule',target:4",
            "title:'Primeiras Nebulosas'",
            "new:'H2',mode:'primordialMolecule',target:4",
            "Crie gás primordial ${made}/${s.target}",
            "const molecularFuel=s.id==='first_atomic_bonds'?{p:9,e:9,n:6}:{p:6,e:6,n:0}",
            "if(isPrimordial(s))return;"
          ];
          for(const x of must)if(!s.includes(x))throw new Error('missing invariant: '+x);
          if(s.includes("ensurePrimordialParticleMix({p:10,e:16,n:8})"))throw new Error('molecular auto-refill still present');
          NODE
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git diff --cached --quiet && exit 0
          git commit -m "Corrige contadores e combustível das fases moleculares [skip ci]"
          git push
