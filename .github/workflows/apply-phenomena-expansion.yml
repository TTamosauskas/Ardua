name: Apply phenomena expansion

on:
  push:
    paths:
      - scripts/apply-phenomena-expansion.mjs
      - .github/workflows/apply-phenomena-expansion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Apply phenomena expansion
        run: node scripts/apply-phenomena-expansion.mjs
      - name: Validate phenomena
        run: node scripts/validate-phenomena-discoveries.mjs
      - name: Commit expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-phenomena-expansion.mjs .github/workflows/apply-phenomena-expansion.yml
          git add assets/js/campaign-discoveries.js scripts/validate-phenomena-discoveries.mjs
          git commit -m "Amplia descobertas cosmologicas e fisicas"
          git push
