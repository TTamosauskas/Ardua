name: Build generational enrichment
on:
  push:
    branches: [feat/generation-enrichment]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/generation-enrichment
          fetch-depth: 0
      - name: Apply enrichment patch
        run: node scripts/patch-generation-enrichment.js
      - name: Validate generation implementation
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-generations.js
          node --check assets/js/campaign-generations-map.js
          node scripts/validate-cumulative-recipes.js
          node - <<'NODE'
          const fs=require('fs');
          const game=fs.readFileSync('assets/js/ardua.js','utf8');
          const graph=fs.readFileSync('assets/js/campaign-graph.js','utf8');
          const mode=fs.readFileSync('assets/js/campaign-mode.js','utf8');
          for(const id of ['first_enrichment','second_birth','second_enrichment','third_birth']){
            if(!game.includes(`id:'${id}'`))throw new Error(`missing engine phase ${id}`);
            if(!graph.includes(`"${id}"`))throw new Error(`missing graph phase ${id}`);
          }
          if(!mode.includes('heritage')||!mode.includes('version:3'))throw new Error('save migration/heritage missing');
          if(!graph.includes('"rb":{"allOf":["o","second_birth"]}'))throw new Error('s-process not gated by second generation');
          if(!graph.includes('"pulsar":{"allOf":["neutron_star","third_birth"]}'))throw new Error('third generation compact branch not gated');
          NODE
      - name: Commit generated implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ardua.js assets/js/campaign-graph.js assets/js/campaign-map.js assets/css/campaign-generations.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add enrichment milestones and chemical heritage"
          git push origin HEAD:feat/generation-enrichment
