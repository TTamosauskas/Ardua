name: Apply stellar plasma phases v2

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/fix-stellar-plasma-migration.py"
      - ".github/workflows/apply-stellar-plasma-phases-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fix migration locator
        run: python scripts/fix-stellar-plasma-migration.py
      - name: Apply stellar plasma phases
        run: python scripts/apply-stellar-plasma-phases.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-phase-names.js
          node --check assets/js/campaign-discoveries.js
          node --check assets/js/campaign-discoveries-phenomena.js
          node --check scripts/validate-stellar-plasma.js
      - name: Validate feature contract
        run: |
          node scripts/validate-stellar-plasma.js
          node scripts/validate-phenomenon-sources.mjs
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-rotation-option.js
      - name: Static regression tests
        run: node tests/validate-static.js
      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/js/campaign-graph.js assets/js/campaign-mode.js assets/js/campaign-phase-names.js assets/js/campaign-discoveries.js assets/js/campaign-discoveries-phenomena.js assets/data/phenomenon-sources.json scripts/validate-phenomenon-sources.mjs scripts/validate-phenomena-discoveries.mjs scripts/validate-cumulative-recipes.js scripts/validate-stellar-plasma.js .github/workflows/pages.yml
          git diff --cached --quiet || git commit -m "feat: add solar wind ionization and recombination phases"
          git push
