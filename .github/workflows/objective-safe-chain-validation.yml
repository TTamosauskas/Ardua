name: Apply and validate objective-safe chains

on:
  push:
    branches: ["fix/objective-safe-chain-knowledge"]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/objective-safe-chain-knowledge

      - name: Apply patch
        run: |
          node scripts/apply-objective-safe-chain-patch.js
          node scripts/fix-objective-safe-chain-legacy-validator.js
          node scripts/fix-objective-safe-chain-cache.js
          node scripts/fix-objective-safe-chain-runtime-validator.js

      - name: Syntax and focused validation
        run: |
          node --check assets/js/ardua.js
          node scripts/validate-objective-safe-chain.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-recipe-planner.js
          node scripts/validate-movement-chain-particles.js

      - name: Full regression suite
        run: |
          node scripts/validate-element-sources.mjs
          node scripts/validate-element-bohr.js
          node scripts/validate-phenomenon-sources.mjs
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-stellar-plasma.js
          node scripts/validate-coronal-jets.js
          node scripts/validate-convection-regression.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-recipe-planner.js
          node scripts/validate-beta-parallel.js
          node scripts/validate-rotation-option.js
          node scripts/validate-recipe-audio-cadence.js
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-discovery-inbox.js
          node scripts/validate-campaign-phase-flow.js
          node scripts/validate-campaign-runtime-regressions.js
          node scripts/validate-phase-goal-hierarchy.js
          node scripts/validate-phase-layout-consistency.js
          node scripts/validate-quarks-phase.js
          node scripts/validate-quarks-chrome.js
          node scripts/validate-objective-safe-chain.js

      - name: Install browser test dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium

      - name: Expose test-only engine hooks
        run: |
          cp assets/js/ardua.js /tmp/ardua-objective-safe.js
          node <<'NODE'
          const fs=require('fs'),p='assets/js/ardua.js';let s=fs.readFileSync(p,'utf8');
          const at=s.lastIndexOf('})();');if(at<0)throw new Error('engine closure not found');
          const hook="\nwindow.__ARDUA_CHAIN_TEST={state,PHASES,phaseIndexById,activeCells,neigh,createPiece,clearBoard,autoFusionCandidate,learnedFusionRecipes,activeFusionRecipes,phaseFusionRecipes,canonicalKnowledgePhaseIds,objectiveAutoDependencyDistances,recipeKey};\n";
          s=s.slice(0,at)+hook+s.slice(at);fs.writeFileSync(p,s);
          NODE

      - name: Browser scenarios
        run: |
          python3 -m http.server 4173 >/tmp/ardua-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node scripts/test-objective-safe-chain-browser.mjs

      - name: Restore production engine and commit
        run: |
          cp /tmp/ardua-objective-safe.js assets/js/ardua.js
          rm -rf node_modules
          rm -f scripts/apply-objective-safe-chain-patch.js scripts/fix-objective-safe-chain-legacy-validator.js scripts/fix-objective-safe-chain-cache.js scripts/fix-objective-safe-chain-runtime-validator.js scripts/test-objective-safe-chain-browser.mjs .github/workflows/objective-safe-chain-validation.yml
          node --check assets/js/ardua.js
          node scripts/validate-objective-safe-chain.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ardua.js index.html scripts/validate-cumulative-recipes.js scripts/validate-movement-chain-particles.js scripts/validate-recipe-audio-cadence.js scripts/validate-objective-safe-chain.js .github/workflows/pages.yml scripts/apply-objective-safe-chain-patch.js scripts/fix-objective-safe-chain-legacy-validator.js scripts/fix-objective-safe-chain-cache.js scripts/fix-objective-safe-chain-runtime-validator.js scripts/test-objective-safe-chain-browser.mjs .github/workflows/objective-safe-chain-validation.yml
          git commit -m "Make reaction chains objective-safe"
          git push origin HEAD:fix/objective-safe-chain-knowledge
