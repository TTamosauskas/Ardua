name: Validate octave victory removal

on:
  push:
    branches: ["fix/remove-octave-victory-song"]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: fix/remove-octave-victory-song

      - name: Apply fix
        run: node scripts/apply-remove-victory-song.js

      - name: Focused validation
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/recipe-audio-sync.js
          node scripts/validate-recipe-audio-cadence.js
          node scripts/validate-phase-runtime-sync.js
          node scripts/validate-scatter-appreciation.js
          node - <<'NODE'
          const fs=require('fs');
          const engine=fs.readFileSync('assets/js/ardua.js','utf8');
          const sync=fs.readFileSync('assets/js/recipe-audio-sync.js','utf8');
          for(const t of ['victorySong','for(let octave=0;octave<3;octave++)','setTimeout(resolve,3640)'])if(engine.includes(t)||sync.includes(t))throw new Error('old octave victory music remains: '+t);
          for(const t of ['playNote(2,motif.root,motif.ratios)','playChord(motif.root,motif.ratios)'])if(!sync.includes(t))throw new Error('note-note-note-chord motif missing: '+t);
          NODE

      - name: Full regression suite
        run: |
          node scripts/validate-element-sources.mjs
          node scripts/validate-element-bohr.js
          node scripts/validate-phenomenon-sources.mjs
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-stellar-plasma.js
          node scripts/validate-coronal-jets.js
          node scripts/validate-convection-regression.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-objective-safe-chain.js
          node scripts/validate-recipe-planner.js
          node scripts/validate-phase-runtime-sync.js
          node scripts/validate-scatter-appreciation.js
          node scripts/validate-beta-parallel.js
          node scripts/validate-rotation-option.js
          node scripts/validate-recipe-audio-cadence.js
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-discovery-inbox.js
          node scripts/validate-campaign-phase-flow.js
          node scripts/validate-campaign-runtime-regressions.js
          node scripts/validate-phase-goal-hierarchy.js
          node scripts/validate-phase-layout-consistency.js
          node scripts/validate-quarks-phase.js
          node scripts/validate-quarks-chrome.js

      - name: Commit permanent fix
        run: |
          rm -f scripts/apply-remove-victory-song.js
          node --check assets/js/ardua.js
          node --check assets/js/recipe-audio-sync.js
          node scripts/validate-recipe-audio-cadence.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ardua.js assets/js/recipe-audio-sync.js index.html scripts/validate-recipe-audio-cadence.js scripts/validate-phase-runtime-sync.js scripts/validate-scatter-appreciation.js scripts/apply-remove-victory-song.js
          git commit -m "Remove octave-rising victory song"
          git push origin HEAD:fix/remove-octave-victory-song
