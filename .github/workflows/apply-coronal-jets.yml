          u=once(u," 'Convecção Estelar':'Convecção',"," 'Convecção Estelar':'Convecção',\n 'Jatos Coronais':'Jato astrofísico',\n 'Reconexão Magnética':'Reconexão magnética',",'aliases Jatos')
          p.write_text(u)

          p=Path('assets/data/phenomenon-sources.json');data=json.loads(p.read_text())
          common={
