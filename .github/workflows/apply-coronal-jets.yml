          if n<2: raise SystemExit(f'Ordem Convecção→Lítio inesperada: {n}')
          g=g.replace('"stellar_convection","stellar_li"','"stellar_convection","coronal_jets","stellar_li"')
          g=once(g,'"stellar_convection":{"allOf":["coulomb_intro"]},"stellar_li":{"allOf":["stellar_convection"]}', '"stellar_convection":{"allOf":["coulomb_intro"]},"coronal_jets":{"allOf":["stellar_convection","stellar_recombination"]},"stellar_li":{"allOf":["coronal_jets"]}', 'prerequisitos Jatos')
          p.write_text(g)

          p=Path('assets/js/campaign-giants-map.js');gm=p.read_text()
          gm=once(gm,"'coulomb_intro','stellar_convection','stellar_li'","'coulomb_intro','stellar_convection','coronal_jets','stellar_li'",'mapa das gigantes')
          p.write_text(gm)

