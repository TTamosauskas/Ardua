name: Apply coronal jets update

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-coronal-jets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Repair staged patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-coronal-jets.py')
          lines=p.read_text().splitlines()
          phase_fixed=False
          obj_fixed=False
          out=[]
          skip_next=False
          for i,line in enumerate(lines):
              if skip_next:
                  skip_next=False
                  continue
              if line.startswith('s=sub1(s,r') and 'fase Jatos' in line:
                  out.append("s=sub1(s,r\"(\\{id:'stellar_convection'[^\\n]*\\},)\",lambda m:m.group(1)+'\\n'+phase,'fase Jatos')")
                  phase_fixed=True
                  continue
              if line.startswith('newobj="""'):
                  payload=line[len('newobj="""'):]
                  out.append('newobj='+repr(payload+'\n  ')+'+obj')
                  if i+1<len(lines) and lines[i+1].strip()=='"+obj': skip_next=True
                  obj_fixed=True
                  continue
              out.append(line)
          if not phase_fixed: raise SystemExit('âncora fase Jatos não encontrada')
          if not obj_fixed: raise SystemExit('âncora newobj não encontrada')
          p.write_text('\n'.join(out)+'\n')
          PY
          python3 -m py_compile scripts/apply-coronal-jets.py
      - name: Apply patch
        run: python3 scripts/apply-coronal-jets.py
      - name: Validate update
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-giants-map.js
          node --check assets/js/campaign-discoveries.js
          node --check assets/js/campaign-discoveries-phenomena.js
          node scripts/validate-coronal-jets.js
          node scripts/validate-stellar-plasma.js
          node scripts/validate-phenomenon-sources.mjs
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-recipe-planner.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-beta-parallel.js
          node scripts/validate-rotation-option.js
          node scripts/validate-recipe-audio-cadence.js
          node scripts/validate-campaign-phase-flow.js
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/js/campaign-graph.js assets/js/campaign-mode.js assets/js/campaign-giants-map.js assets/js/campaign-discoveries.js assets/js/campaign-discoveries-phenomena.js assets/data/phenomenon-sources.json scripts/validate-phenomena-discoveries.mjs scripts/validate-stellar-plasma.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: add coronal jet phase and cumulative plasma chemistry"
          git push origin HEAD:main
