          p=Path('assets/js/campaign-mode.js');cm=p.read_text()
          cm=cm.replace('version:13','version:14')
          marker="""  if(previousVersion<10){
"""
          migration="""  if(previousVersion<14){
   const coronalDownstream=['giant_formation','fragile','c','n','o','rb','sr','y','zr','nb','gamma_mo','tc','gamma_ru','rh','pd','ag','cd','in','sn','sb','te','i','xe','cs','ba','la','ce','pr','nd','pm','sm','pb','bi'];
   if(next.completed.includes('stellar_li')||coronalDownstream.some(id=>seen.has(id)))next.completed=uniq([...next.completed,'coronal_jets']);
   else if(next.activeId==='stellar_li'&&!next.completed.includes('stellar_li')&&next.completed.includes('stellar_convection'))next.activeId=next.completed.includes('stellar_recombination')?'coronal_jets':'solar_wind';
  }
  if(previousVersion<10){
"""
          cm=once(cm,marker,migration,'migração v14')
          p.write_text(cm)

          # Discoveries and Wikipedia aliases.
          p=Path('assets/js/campaign-discoveries.js');d=p.read_text()
          anchor=" {key:'phenomenon:stellarConvection',glyph:'↕',title:'Convecção Estelar',group:'Processos estelares',text:'Correntes de plasma transportam matéria e energia entre diferentes regiões da estrela.',phases:['stellar_convection'],infer:['stellar_convection']},"
          extra=anchor+"\n {key:'phenomenon:coronalJet',glyph:'↗',title:'Jatos Coronais',group:'Processos estelares',text:'Jatos estreitos e rápidos de plasma podem ser acelerados para fora da atmosfera estelar por reconexão magnética.',phases:['coronal_jets'],infer:['coronal_jets']},\n {key:'phenomenon:magneticReconnection',glyph:'⌁',title:'Reconexão Magnética',group:'Processos estelares',text:'Linhas de campo magnético podem mudar de conectividade e liberar energia, acelerando plasma ionizado na atmosfera estelar.',phases:['coronal_jets'],infer:['coronal_jets']},"
          d=once(d,anchor,extra,'descobertas Jatos')
