name: Apply high-mass formation map entry
on:
  push:
    branches:
      - fix/high-mass-formation-map-entry
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/high-mass-formation-map-entry
      - name: Apply patch
        run: node scripts/patch-high-mass-formation-map-entry.js
      - name: Validate syntax
        run: |
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-supergiants-map.js
          node --check assets/js/campaign-supergiants.js
      - name: Validate cumulative recipes
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate stellar formation map entries
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const map=fs.readFileSync('assets/js/campaign-map.js','utf8');
          const sgMap=fs.readFileSync('assets/js/campaign-supergiants-map.js','utf8');
          const sg=fs.readFileSync('assets/js/campaign-supergiants.js','utf8');
          const graph=fs.readFileSync('assets/js/campaign-graph.js','utf8');
          const engine=fs.readFileSync('assets/js/ardua.js','utf8');
          if(!map.includes("connectActiveSphere('stellar',G.sequences.high[0],'high')"))throw new Error('alta massa ainda aponta direto para carbon_burn');
          if(map.includes("connectActiveSphere('stellar','carbon_burn','high')"))throw new Error('atalho visual para carbon_burn ainda existe');
          if(!sg.includes("const entry='high_mass_formation';"))throw new Error('entrada de alta massa ausente em supergigantes');
          if(!sgMap.includes("moveNodes([S.entry,S.precursor],precursorFlow)"))throw new Error('formação de alta massa é descartada ao montar supergigantes');
          if(!map.includes("connectActiveSphere('stellar',G.sequences.brown[0],'sub')"))throw new Error('entrada anã marrom não usa formação');
          if(!map.includes("connectActiveSphere('stellar',G.sequences.red[0],'low')"))throw new Error('entrada baixa massa não usa formação');
          if(!map.includes("byPhase(G.sequences.mid[0])"))throw new Error('entrada intermediária não usa formação');
          const highSeq=graph.match(/"high":\[(.*?)\]/)?.[1]||'';
          if(!highSeq.trim().startsWith('"high_mass_formation"'))throw new Error('high_mass_formation não é o primeiro nó da sequência high');
          if(highSeq.indexOf('high_mass_formation')>highSeq.indexOf('carbon_burn'))throw new Error('ordem alta massa incorreta');
          const phase=engine.split('\n').find(x=>x.includes("id:'high_mass_formation'"));
          if(!phase?.includes('formationLayers:5,target:91'))throw new Error('geometria 5 camadas / 91 H ausente');
          console.log('stellar formation map entry invariants ok');
          NODE
      - name: Commit product change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/campaign-map.js assets/js/campaign-supergiants-map.js assets/js/campaign-supergiants.js
          git commit -m "fix: preserva formação de alta massa no mapa"
          git push
