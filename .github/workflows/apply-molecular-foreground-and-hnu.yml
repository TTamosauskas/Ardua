name: Apply molecular foreground and hnu
on:
  push:
    branches:
      - fix/molecular-foreground-and-hnu
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: node scripts/patch-molecular-foreground-and-hnu.js
      - name: Validate syntax
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate requested invariants
        run: |
          grep -F "orbit=27,frames=[]" assets/js/ardua.js
          grep -F "duration:1450" assets/js/ardua.js
          grep -F "molecular-photon{position:absolute;z-index:43;width:30px;height:30px;border-radius:50%" assets/css/ardua.css
          grep -F "#ffe45c 42%,#ffb300 72%" assets/css/ardua.css
          grep -F "function primordialHeHMoleculeTarget(piece,selected,s=phase()){const m=primordialMoleculeForPiece(piece);return s.id==='first_nebulae'" assets/js/ardua.js
          grep -F "primordialPieceTarget=primordial&&p.free&&!p.moleculeId" assets/js/ardua.js
          grep -F "primordialMoleculeTarget=primordial&&primordialHeHMoleculeTarget(p,selectedFree,s)" assets/js/ardua.js
          grep -F "reactPrimordialHeHWithHydrogen(m,selectedAtom)" assets/js/ardua.js
          grep -F ".atom:not([data-molecule]){z-index:4}" assets/css/ardua.css
          grep -F ".atom[data-molecule]{z-index:0" assets/css/ardua.css
          grep -F ".primordial-layer{z-index:18}" assets/css/ardua.css
          test "$(grep -o "emitMolecularPhoton(x,y)" assets/js/ardua.js | wc -l)" -eq 2
      - name: Commit product change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ardua.js assets/css/ardua.css
          git commit -m "Refina fóton e seleção das moléculas primordiais" || exit 0
          git push
