name: Apply equal recipe cadence

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-equal-recipe-cadence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Equalize target-recipe cadence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assets/js/recipe-audio-sync.js')
          s=p.read_text(encoding='utf-8')
          old_comment="""/* Stretch the engine's own objective-motif waits, so audio and animation share
             exactly the same expanded cadence. The two waits before the ingredient
             highlight are doubled; the two waits from highlight to union are tripled. */"""
          new_comment="""/* Stretch the engine's own objective-motif waits, so audio and animation share
             exactly the same expanded cadence. The pause from the second note to the
             third and the pause from the third note to the union/chord use the same 2x cadence. */"""
          old_map="const cadence=new Map([[105,210],[75,150],[28,56],[32,64],[285,855],[115,345],[70,210],[42,126]]);"
          new_map="const cadence=new Map([[105,210],[75,150],[28,56],[32,64],[285,570],[115,230],[70,140],[42,84]]);"
          old_meta="cadence:Object.freeze({note2To3:'2x',note3ToChord:'3x'})"
          new_meta="cadence:Object.freeze({note2To3:'2x',note3ToChord:'2x'})"
          for old,new,label in [(old_comment,new_comment,'comment'),(old_map,new_map,'cadence map'),(old_meta,new_meta,'cadence metadata')]:
              if new in s:
                  continue
              if old not in s:
                  raise SystemExit(f'{label} anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check recipe audio syntax
        run: node --check assets/js/recipe-audio-sync.js
      - name: Verify equal cadence
        run: |
          grep -Fq "[285,570]" assets/js/recipe-audio-sync.js
          grep -Fq "[115,230]" assets/js/recipe-audio-sync.js
          grep -Fq "[70,140]" assets/js/recipe-audio-sync.js
          grep -Fq "[42,84]" assets/js/recipe-audio-sync.js
          grep -Fq "note2To3:'2x',note3ToChord:'2x'" assets/js/recipe-audio-sync.js
      - name: Commit cadence update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/recipe-audio-sync.js
          git diff --cached --quiet || git commit -m "audio: equalize third-note to chord pause"
          git push
