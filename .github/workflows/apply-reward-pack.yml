name: Apply reward and discovery pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-reward-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/reward-pack-v1.py').read_text()
          compile(src,'.github/reward-pack-v1.py','exec')
          print('migration helper syntax ok')
          PY
      - name: Apply reward pack
        run: python .github/reward-pack-v1.py
      - name: Validate engine and permanent tests
        shell: bash
        run: |
          node --check assets/js/ardua.js
          node tests/validate-static.js
          grep -q "const RewardDirector=Object.freeze" assets/js/ardua.js
          grep -q "Atlas de descobertas" index.html
          grep -q "prefers-reduced-motion:reduce" assets/css/ardua.css
      - name: Commit clean result
        shell: bash
        run: |
          rm -f .github/reward-pack-v1.py .github/workflows/apply-reward-pack.yml
          rm -rf .github/__pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add reward rhythm and discovery pack'
          git push
