name: Fix molecular target override
on:
  push:
    branches:
      - fix/molecular-target-override
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply override fix
        run: |
          python -c "from pathlib import Path; p=Path('assets/js/ardua.js'); s=p.read_text(); old=\"set('first_atomic_bonds',6,6);set('first_nebulae',6,6);\"; new=\"set('first_atomic_bonds',4,4);set('first_nebulae',4,4);\"; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Validate syntax
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate molecular targets
        run: |
          grep -F "set('first_atomic_bonds',4,4);set('first_nebulae',4,4);" assets/js/ardua.js
          ! grep -F "set('first_atomic_bonds',6,6);set('first_nebulae',6,6);" assets/js/ardua.js
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/js/ardua.js
          git commit -m "Corrige override dos objetivos moleculares" || exit 0
          git push
