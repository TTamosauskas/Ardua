name: Apply requested campaign UX and phase flow

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-campaign-ux-round2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python scripts/apply-campaign-ux-temp.py

      - name: Validate syntax and contracts
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/rotation-polish.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-mode.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-giants-map.js
          node --check assets/js/campaign-phase-modal.js
          node scripts/validate-stellar-plasma.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-rotation-option.js
          node scripts/validate-campaign-phase-flow.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-beta-parallel.js

      - name: Commit runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/js/rotation-polish.js assets/js/campaign-graph.js assets/js/campaign-mode.js assets/js/campaign-map.js assets/js/campaign-giants-map.js assets/js/campaign-phase-modal.js scripts/validate-stellar-plasma.js scripts/validate-movement-chain-particles.js scripts/validate-rotation-option.js scripts/validate-campaign-phase-flow.js .github/workflows/pages.yml
          git diff --cached --check
          git commit -m "feat: rebalance stellar lessons and phase flow"
          git push origin HEAD:main
