name: Apply formation sizes and highlights
on:
  push:
    branches:
      - fix/formation-sizes-and-pair-highlights
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/formation-sizes-and-pair-highlights
      - name: Apply patch
        run: node scripts/patch-formation-sizes-and-highlights.js
      - name: Validate syntax
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate formation geometry and highlights
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const engine=fs.readFileSync('assets/js/ardua.js','utf8');
          const graph=fs.readFileSync('assets/js/campaign-graph.js','utf8');
          const expected=[
            ["low_mass_formation",2,7],
            ["intermediate_mass_formation",3,19],
            ["giant_formation",4,37],
            ["high_mass_formation",5,61]
          ];
          for(const [id,layers,total] of expected){
            const re=new RegExp(`id:'${id}'[^\\n]*formationLayers:${layers},target:${total}`);
            if(!re.test(engine))throw new Error(`geometry mismatch ${id}`);
          }
          if(!engine.includes('function stellarFormationAtomSize(spec=stellarFormationSpec())'))throw new Error('dynamic formation atom size missing');
          if(!engine.includes("starSize()*.88/(2*spec.radius+1)"))throw new Error('formation atom size does not follow stellar cell scale');
          if(engine.includes('stellarFormationFiveLayerAtomSize'))throw new Error('legacy five-layer-only atom sizing remains');
          if(!engine.includes('if(candidates[0])compatible.add(candidates[0].id)'))throw new Error('single compatible highlight missing');
          if(!engine.includes("local=stellarFormationSeedLayout(count,spec)"))throw new Error('pair spacing is not scale-aware');
          const highSeq=graph.match(/"high":\[(.*?)\]/)?.[1]||'';
          if(highSeq.indexOf('high_mass_formation')<0||highSeq.indexOf('carbon_burn')<0||highSeq.indexOf('high_mass_formation')>highSeq.indexOf('carbon_burn'))throw new Error('high mass formation is not before carbon burn');
          console.log('formation geometry/highlight invariants ok');
          NODE
      - name: Commit product change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git commit -m "fix: ajusta escala e destaques das formações estelares"
          git push
