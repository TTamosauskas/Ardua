name: Apply formation rings outside core
on:
  push:
    branches:
      - fix/formation-rings-outside-core
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/formation-rings-outside-core
      - name: Apply patch
        run: node scripts/patch-formation-rings-outside-core.js
      - name: Validate syntax
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipes
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate formation geometry
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const engine=fs.readFileSync('assets/js/ardua.js','utf8');
          const css=fs.readFileSync('assets/css/stellar-formation.css','utf8');
          const graph=fs.readFileSync('assets/js/campaign-graph.js','utf8');
          const expected=[
            ['low_mass_formation',2,19,9],
            ['intermediate_mass_formation',3,37,18],
            ['giant_formation',4,61,30],
            ['high_mass_formation',5,91,45]
          ];
          for(const [id,layers,total,pairs] of expected){
            const line=engine.split('\n').find(x=>x.includes(`id:'${id}'`));
            if(!line)throw new Error(`missing ${id}`);
            if(!line.includes(`formationLayers:${layers},target:${total}`))throw new Error(`geometry ${id}`);
            if(!line.includes(`Reúna ${pairs} duplas de H`))throw new Error(`pairs ${id}`);
            if(!line.includes(`menuTag:'${total} H'`))throw new Error(`menu ${id}`);
          }
          const first=engine.split('\n').find(x=>x.includes("id:'first_generation_formation'"));
          const brown=engine.split('\n').find(x=>x.includes("id:'brown_formation'"));
          if(!first?.includes('formationLayers:4,target:37'))throw new Error('first generation geometry changed');
          if(!brown?.includes('formationLayers:2,target:7'))throw new Error('brown geometry changed');
          if(!engine.includes("layersOutsideCore=!['first_generation_formation','brown_formation'].includes(s?.id),radius=layersOutsideCore?layers:layers-1"))throw new Error('outside-core semantics missing');
          if(!engine.includes("if(candidates[0])compatible.add(candidates[0].id)"))throw new Error('two-group green highlight rule missing');
          if(!engine.includes("dom.star.parentElement?.classList.add('formation-ready-shell')"))throw new Error('external completion action missing');
          if(!css.includes('.star-shell.formation-ready-shell'))throw new Error('formation ready shell css missing');
          if(!css.includes('bottom:-58px'))throw new Error('completion button still centered');
          const highSeq=graph.match(/"high":\[(.*?)\]/)?.[1]||'';
          if(highSeq.indexOf('high_mass_formation')<0||highSeq.indexOf('carbon_burn')<0||highSeq.indexOf('high_mass_formation')>highSeq.indexOf('carbon_burn'))throw new Error('high mass formation order');
          if(!engine.includes('const MAX_RADIUS=5;'))throw new Error('board radius changed');
          console.log('formation outside-core invariants ok');
          NODE
      - name: Commit product change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/css/stellar-formation.css
          git commit -m "fix: conta camadas fora do núcleo estelar"
          git push
