name: Apply formation H nebula style
on:
  push:
    branches:
      - fix/formation-h-nebula-style
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/formation-h-nebula-style
      - name: Apply patch
        run: node scripts/patch-formation-h-nebula-style.js
      - name: Validate syntax
        run: node --check assets/js/ardua.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate nebula H style
        run: |
          grep -F "width:clamp(39px,9.7vw,49px)" assets/css/stellar-formation.css
          grep -F "Math.max(39,Math.min(49,window.innerWidth*.097))" assets/js/ardua.js
      - name: Commit product change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git commit -m "fix: usa estética da nebulosa nos H da formação"
          git push
