name: Implement discovery inbox

on:
  push:
    branches: ["feat/discovery-unread-flow"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/discovery-unread-flow

      - name: Apply discovery flow update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, fn):
              p=Path(path); s=p.read_text(); n=fn(s)
              if n==s: raise SystemExit(f'patch produced no change: {path}')
              p.write_text(n)

          def patch_index(s):
              if 'campaign-discovery-notifications.css' not in s:
                  s=s.replace('<link rel="stylesheet" href="assets/css/campaign-phase-modal.css"/>','<link rel="stylesheet" href="assets/css/campaign-phase-modal.css"/>\n<link rel="stylesheet" href="assets/css/campaign-discovery-notifications.css"/>')
              if 'campaign-discovery-notifications.js' not in s:
                  s=s.replace('<script src="assets/js/campaign-fork-links.js"></script>','<script src="assets/js/campaign-fork-links.js"></script>\n<script src="assets/js/campaign-discovery-notifications.js"></script>')
              return s
          edit('index.html', patch_index)

          def patch_discoveries(s):
              if 'ARDUA_DISCOVERY_INDEX' not in s:
                  marker='\n\nfunction saveData()'
                  at=s.index(marker)
                  line="\nwindow.ARDUA_DISCOVERY_INDEX=Object.freeze(Object.fromEntries(PHENOMENA.map(({key,title,group,glyph})=>[key,Object.freeze({key,title,group,glyph})])));"
                  s=s[:at]+line+s[at:]
              old="b.type='button';b.className='discovery-card unlocked';b.innerHTML="
              new="b.type='button';b.className='discovery-card unlocked';b.dataset.discoveryKey=entry.key;b.innerHTML="
              if old in s:s=s.replace(old,new,1)
              return s
          edit('assets/js/campaign-discoveries.js', patch_discoveries)

          def patch_map(s):
              old="clearTimeout(returnTimer);returnTimer=setTimeout(()=>showMap({required:true,focusCurrent:true}),1500)"
              new="clearTimeout(returnTimer);showMap({required:true,focusCurrent:true,instant:true})"
              if old not in s: raise SystemExit('campaign-map delayed return contract not found')
              return s.replace(old,new,1)
          edit('assets/js/campaign-map.js', patch_map)

          def patch_modal(s):
              old="function yieldEngineIntro(){if(map.classList.contains('show'))dismissEngineIntro()}"
              new="function yieldEngineIntro(){if(!map.classList.contains('show'))return;closePreview();dismissEngineIntro()}"
              if old not in s: raise SystemExit('campaign-phase-modal map ownership contract not found')
              return s.replace(old,new,1)
          edit('assets/js/campaign-phase-modal.js', patch_modal)

          def patch_pages(s):
              if 'campaign-discovery-notifications.js' not in s:
                  s=s.replace('          node --check assets/js/campaign-discoveries-phenomena.js','          node --check assets/js/campaign-discoveries-phenomena.js\n          node --check assets/js/campaign-discovery-notifications.js')
              if 'Validate discovery inbox' not in s:
                  s=s.replace('      - name: Validate campaign phase flow\n        run: node scripts/validate-campaign-phase-flow.js','      - name: Validate discovery inbox\n        run: node scripts/validate-discovery-inbox.js\n\n      - name: Validate campaign phase flow\n        run: node scripts/validate-campaign-phase-flow.js')
              return s
          edit('.github/workflows/pages.yml', patch_pages)
          PY

          cat > assets/js/campaign-discovery-notifications.js <<'EOF'
          /* Ardua — persistent unread discoveries, centered discovery acknowledgements and menu badges. */
          (()=>{
          'use strict';
          const SAVE_KEY='stellarForgeV1013',INBOX_KEY='arduaDiscoveryInboxV1';
          const $=id=>document.getElementById(id);
          const SPECIAL_BASE=Object.freeze({D:'H',T:'H',He3:'He',HeU:'He',Be7:'Be',Be8:'Be',C13:'C',Ne22:'Ne',FeU:'Fe'});
          const SPECIAL_NAMES=Object.freeze({D:'Deutério',T:'Trítio',He3:'Hélio-3',HeU:'Hélio instável',Be7:'Berílio-7',Be8:'Berílio-8',C13:'Carbono-13',Ne22:'Neônio-22',FeU:'Ferro instável'});
          const TITLE_OVERRIDES=Object.freeze({'phenomenon:coronalJet':'Ejeção de Massa Coronal'});
          const queue=[],queued=new Set();let current=null,renderFrame=0;

          function parse(raw,fallback={}){try{return raw?JSON.parse(raw):fallback}catch(_e){return fallback}}
          function savedRewards(){return new Set(parse(localStorage.getItem(SAVE_KEY),{}).rewardDiscoveries||[])}
          function discoveryIndex(){return window.ARDUA_DISCOVERY_INDEX||{}}
          function elementCard(sym){return [...document.querySelectorAll('#catalog .el-card')].find(card=>card.querySelector('.s')?.textContent?.trim()===sym)||null}
          function baseElementSymbol(sym){return SPECIAL_BASE[sym]||sym}
          function itemKeyFor(rawKey){
            const key=String(rawKey||'');
            if(key.startsWith('element:')){const sym=key.slice(8),base=baseElementSymbol(sym);return elementCard(base)?`element:${base}`:null}
            return discoveryIndex()[key]?key:null;
          }
          function elementName(sym){const card=elementCard(baseElementSymbol(sym));return SPECIAL_NAMES[sym]||card?.querySelector('.nm')?.textContent?.trim()||sym}
          function displayTitle(rawKey){
            const key=String(rawKey||'');if(TITLE_OVERRIDES[key])return TITLE_OVERRIDES[key];
            if(key.startsWith('element:'))return elementName(key.slice(8));
            return discoveryIndex()[key]?.title||key.split(':').pop()||'Descoberta';
          }
          function discoveryWord(title){
            const t=String(title||'').trim(),u=t.toLocaleUpperCase('pt-BR');
            const femininePlural=/^(ERUPÇÕES|ONDAS|ESTRELAS)/.test(u);
            const masculinePlural=/^(PRÓTONS|NÊUTRONS|ELÉTRONS|NEUTRINOS|ANTINEUTRINOS|PÓSITRONS|RAIOS|JATOS)/.test(u);
            const feminine=/^(ANÃ|GIGANTE|SUPERGIGANTE|ESTRELA|NUCLEOSSÍNTESE|RECOMBINAÇÃO|IONIZAÇÃO|BARREIRA|CONVECÇÃO|RECONEXÃO|PRESSÃO|ESPALAÇÃO|NEUTRONIZAÇÃO|CAPTURA|FOTODESINTEGRAÇÃO|SUPERNOVA|KILONOVA|RADIAÇÃO|EJEÇÃO|CADEIA|PRATA|PLATINA)/.test(u);
            if(femininePlural)return'DESCOBERTAS';if(masculinePlural)return'DESCOBERTOS';return feminine?'DESCOBERTA':'DESCOBERTO';
          }
          function modalTitle(rawKey){const title=displayTitle(rawKey);return`${title.toLocaleUpperCase('pt-BR')} ${discoveryWord(title)}`}

          let inbox=parse(localStorage.getItem(INBOX_KEY),null);
          if(!inbox||inbox.version!==1){inbox={version:1,known:[...savedRewards()],unread:[]};localStorage.setItem(INBOX_KEY,JSON.stringify(inbox))}
          let known=new Set(inbox.known||[]),unread=new Set(inbox.unread||[]);
          function persist(){inbox={version:1,known:[...known],unread:[...unread]};localStorage.setItem(INBOX_KEY,JSON.stringify(inbox))}

          function ensureModal(){
            let host=$('discoveryUnlockModal');if(host)return host;
            host=document.createElement('div');host.id='discoveryUnlockModal';host.className='discovery-unlock-modal';host.setAttribute('aria-hidden','true');
            host.innerHTML='<section class="discovery-unlock-card" role="dialog" aria-modal="true" aria-labelledby="discoveryUnlockTitle"><strong id="discoveryUnlockTitle"></strong><p>Confira suas descobertas no menu.</p><button type="button" id="discoveryUnlockContinue">CONTINUAR</button></section>';
            document.body.appendChild(host);$('discoveryUnlockContinue')?.addEventListener('click',dismissModal);return host;
          }
          function showNext(){
            if(current||!queue.length)return;current=queue.shift();queued.delete(current);const host=ensureModal();$('discoveryUnlockTitle').textContent=modalTitle(current);host.classList.add('show');host.setAttribute('aria-hidden','false');requestAnimationFrame(()=>$('discoveryUnlockContinue')?.focus())
          }
          function dismissModal(){const host=ensureModal();host.classList.remove('show');host.setAttribute('aria-hidden','true');current=null;setTimeout(showNext,90)}
          function enqueue(rawKey){if(current===rawKey||queued.has(rawKey))return;queued.add(rawKey);queue.push(rawKey);showNext()}

          function scheduleRender(){if(renderFrame)return;renderFrame=requestAnimationFrame(()=>{renderFrame=0;renderIndicators()})}
          function unreadForElement(sym){const key=`element:${sym}`;return unread.has(key)}
          function renderIndicators(){
            const count=unread.size,menu=$('menuOpenBtn'),quick=$('phaseQuickDiscoveries');
            menu?.classList.toggle('discovery-has-unread',count>0);
            if(quick){quick.classList.toggle('discovery-has-unread',count>0);quick.dataset.unreadCount=String(count)}
            document.querySelectorAll('#catalog .el-card').forEach(card=>{const sym=card.querySelector('.s')?.textContent?.trim()||'';card.classList.toggle('discovery-unread',!!sym&&unreadForElement(sym))});
            document.querySelectorAll('#discoveryAtlas .discovery-card[data-discovery-key]').forEach(card=>card.classList.toggle('discovery-unread',unread.has(card.dataset.discoveryKey||'')));
            window.dispatchEvent(new CustomEvent('ardua:discovery-inbox',{detail:{count,unread:[...unread]}}));
          }
          function ingest(keys,announce){
            let changed=false;
            for(const rawKey of keys){if(known.has(rawKey))continue;known.add(rawKey);changed=true;const item=itemKeyFor(rawKey);if(!item)continue;unread.add(item);if(announce)enqueue(rawKey)}
            if(changed){persist();scheduleRender()}
          }
          function checkSavedRewards(announce=true){const rewards=savedRewards(),fresh=[...rewards].filter(key=>!known.has(key));if(fresh.length)ingest(fresh,announce)}
          function markRead(itemKey){if(!itemKey||!unread.delete(itemKey))return;persist();scheduleRender()}

          const previousSet=Storage.prototype.setItem;
          Storage.prototype.setItem=function(key,value){const result=previousSet.apply(this,arguments);if(this===localStorage&&key===SAVE_KEY)checkSavedRewards(true);return result};

          document.addEventListener('click',e=>{
            const target=e.target instanceof Element?e.target:null;if(!target)return;
            const element=target.closest('#catalog .el-card');if(element){const sym=element.querySelector('.s')?.textContent?.trim();if(sym)markRead(`element:${sym}`)}
            const phenomenon=target.closest('#discoveryAtlas .discovery-card[data-discovery-key]');if(phenomenon)markRead(phenomenon.dataset.discoveryKey||'');
          },true);

          const menuModal=$('menuModal');if(menuModal)new MutationObserver(scheduleRender).observe(menuModal,{childList:true,subtree:true});
          const ambient=$('ambientBanner');
          function clearLegacyReward(){
            if(!ambient?.classList.contains('show'))return;
            if(ambient.classList.contains('discovery')||ambient.classList.contains('completion'))queueMicrotask(()=>$('ambientContinueBtn')?.click());
          }
          if(ambient)new MutationObserver(clearLegacyReward).observe(ambient,{attributes:true,attributeFilter:['class']});
          window.addEventListener('storage',e=>{if(e.key===SAVE_KEY)checkSavedRewards(false);if(e.key===INBOX_KEY){const next=parse(e.newValue,null);if(next?.version===1){known=new Set(next.known||[]);unread=new Set(next.unread||[]);scheduleRender()}}});
          window.addEventListener('ardua:campaign-progress',()=>{checkSavedRewards(true);scheduleRender()});
          window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ensureModal().classList.contains('show')){e.preventDefault();dismissModal()}});

          checkSavedRewards(false);ensureModal();scheduleRender();clearLegacyReward();
          })();
          EOF

          cat > assets/css/campaign-discovery-notifications.css <<'EOF'
          /* Ardua — unread discovery indicators and centered discovery acknowledgement. */
          #menuOpenBtn{position:relative}
          #menuOpenBtn.discovery-has-unread::after{
            content:'★';position:absolute;right:-5px;top:-7px;z-index:3;display:grid;place-items:center;
            min-width:20px;height:20px;padding:0 3px;border-radius:999px;background:#17243a;color:#ffd86f;
            border:1px solid rgba(255,224,126,.55);box-shadow:0 4px 16px rgba(0,0,0,.38),0 0 12px rgba(255,215,100,.26);font-size:12px;line-height:1;
          }
          #phaseQuickDiscoveries{position:relative;padding-right:48px!important}
          #phaseQuickDiscoveries.discovery-has-unread::after{
            content:attr(data-unread-count);position:absolute;right:14px;top:50%;transform:translateY(-50%);display:grid;place-items:center;
            min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#ffd86f;color:#111827;font-size:10px;font-weight:950;line-height:1;
            box-shadow:0 0 0 1px rgba(255,255,255,.28),0 4px 15px rgba(0,0,0,.24);
          }
          #catalog .el-card,#discoveryAtlas .discovery-card{position:relative}
          #catalog .el-card.discovery-unread::after,#discoveryAtlas .discovery-card.discovery-unread::after{
            content:'★';position:absolute;right:5px;top:5px;z-index:5;color:#ffd86f;font-size:13px;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.85),0 0 9px rgba(255,216,111,.36);pointer-events:none;
          }
          .ambient-banner.reward-banner.discovery,.ambient-banner.reward-banner.completion{display:none!important}
          .discovery-unlock-modal{
            position:fixed;inset:0;z-index:760;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
            background:rgba(2,6,15,.34);backdrop-filter:blur(3px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,visibility .18s ease;
          }
          .discovery-unlock-modal.show{opacity:1;visibility:visible;pointer-events:auto}
          .discovery-unlock-card{
            width:min(88vw,390px);padding:20px 18px 16px;border:1px solid rgba(255,221,136,.31);border-radius:20px;
            background:linear-gradient(180deg,rgba(17,27,49,.97),rgba(7,13,27,.97));box-shadow:0 26px 80px rgba(0,0,0,.62),0 0 38px rgba(255,220,128,.09);text-align:center;
          }
          .discovery-unlock-card strong{display:block;color:#f7fbff;font-size:20px;line-height:1.12;font-weight:950;letter-spacing:.025em;text-transform:uppercase}
          .discovery-unlock-card p{margin:9px 0 0;color:#c8d4e6;font-size:12px;line-height:1.45}
          .discovery-unlock-card button{width:100%;margin-top:15px;border:0;border-radius:12px;padding:10px 12px;background:linear-gradient(135deg,#8bdcff,#bba8ff);color:#07111f;font-size:10px;font-weight:950;cursor:pointer}
          @media(max-width:420px){.discovery-unlock-card{width:min(92vw,350px);padding:18px 15px 14px}.discovery-unlock-card strong{font-size:18px}}
          @media(prefers-reduced-motion:reduce){.discovery-unlock-modal{transition-duration:.05s}}
          EOF

          cat > scripts/validate-discovery-inbox.js <<'EOF'
          const fs=require('fs');
          const ui=fs.readFileSync('assets/js/campaign-discovery-notifications.js','utf8');
          const css=fs.readFileSync('assets/css/campaign-discovery-notifications.css','utf8');
          const discoveries=fs.readFileSync('assets/js/campaign-discoveries.js','utf8');
          const map=fs.readFileSync('assets/js/campaign-map.js','utf8');
          const modal=fs.readFileSync('assets/js/campaign-phase-modal.js','utf8');
          const index=fs.readFileSync('index.html','utf8');
          for(const token of ['arduaDiscoveryInboxV1','Confira suas descobertas no menu.','discovery-has-unread','discovery-unread','markRead(`element:${sym}`)','data-unread-count'])if(!ui.includes(token))throw new Error('Discovery inbox perdeu contrato: '+token);
          for(const token of ["content:'★'",'.discovery-unlock-modal','place-items:center','.reward-banner.discovery','.reward-banner.completion'])if(!css.includes(token))throw new Error('Discovery inbox CSS perdeu contrato: '+token);
          if(!discoveries.includes('window.ARDUA_DISCOVERY_INDEX='))throw new Error('Índice público de descobertas ausente');
          if(!discoveries.includes('b.dataset.discoveryKey=entry.key'))throw new Error('Cards de fenômenos precisam preservar a chave da descoberta');
          if(map.includes('returnTimer=setTimeout(()=>showMap({required:true,focusCurrent:true}),1500)'))throw new Error('Retorno ao mapa voltou a esperar 1,5 s');
          if(!map.includes('showMap({required:true,focusCurrent:true,instant:true})'))throw new Error('Fim de fase precisa abrir o mapa imediatamente');
          if(!modal.includes("closePreview();dismissEngineIntro()"))throw new Error('Mapa precisa fechar qualquer preview de fase');
          if(!index.includes('campaign-discovery-notifications.js')||!index.includes('campaign-discovery-notifications.css'))throw new Error('Discovery inbox fora do index');
          console.log('Discovery inbox OK: modal central, não lidos persistentes, badges e retorno imediato ao mapa validados.');
          EOF

      - name: Validate update
        shell: bash
        run: |
          node --check assets/js/campaign-discovery-notifications.js
          node --check assets/js/campaign-discoveries.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-phase-modal.js
          node scripts/validate-discovery-inbox.js
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-campaign-phase-flow.js

      - name: Persist implementation
        shell: bash
        run: |
          rm .github/workflows/implement-discovery-inbox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add unread discovery inbox and direct map return"
          git push origin HEAD:feat/discovery-unread-flow
