name: Apply primordial molecules
on:
  push:
    branches: [feat/primordial-molecules]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply product patch
        run: node scripts/patch-primordial-molecules.js
      - name: Syntax checks
        run: |
          node --check assets/js/ardua.js
          node --check assets/js/campaign-graph.js
          node --check assets/js/campaign-generations.js
          node --check assets/js/campaign-map.js
          node --check assets/js/campaign-mode.js
      - name: Validate cumulative recipe architecture
        run: node scripts/validate-cumulative-recipes.js
      - name: Validate primordial molecular phases
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const engine=fs.readFileSync('assets/js/ardua.js','utf8');
          const map=fs.readFileSync('assets/js/campaign-map.js','utf8');
          const gen=fs.readFileSync('assets/js/campaign-generations.js','utf8');
          const mode=fs.readFileSync('assets/js/campaign-mode.js','utf8');
          const css=fs.readFileSync('assets/css/ardua.css','utf8');
          const ctx={window:{}};vm.createContext(ctx);vm.runInContext(fs.readFileSync('assets/js/campaign-graph.js','utf8'),ctx);const G=ctx.window.ARDUA_CAMPAIGN_GRAPH;
          if(G.version!==6)throw new Error('graph v6 missing');
          const ids=['atomic_li','first_atomic_bonds','first_nebulae','first_generation_formation'],idx=ids.map(id=>G.baseOrder.indexOf(id));
          if(idx.some(i=>i<0)||!idx.every((v,i)=>i===0||v===idx[i-1]+1))throw new Error('molecular phase order invalid: '+idx.join(','));
          if(JSON.stringify(G.sequences.molecular)!==JSON.stringify(['first_atomic_bonds','first_nebulae']))throw new Error('molecular sequence invalid');
          if(JSON.stringify(G.prerequisites.first_atomic_bonds?.allOf)!==JSON.stringify(['atomic_li']))throw new Error('first bond gate invalid');
          if(JSON.stringify(G.prerequisites.first_nebulae?.allOf)!==JSON.stringify(['first_atomic_bonds']))throw new Error('nebula gate invalid');
          if(JSON.stringify(G.prerequisites.first_generation_formation?.allOf)!==JSON.stringify(['first_nebulae']))throw new Error('stellar formation gate invalid');
          const checks=[
            [engine.includes("id:'first_atomic_bonds'"),'first molecular phase missing'],
            [engine.includes("id:'first_nebulae'"),'second molecular phase missing'],
            [engine.includes("title:'Primeiras Ligações Atômicas'"),'first phase title missing'],
            [engine.includes("title:'Primeiras Nebulosas'"),'second phase title missing'],
            [engine.includes("Forme Hidreto de Hélio ${made}/${s.target}"),'HeH objective missing'],
            [engine.includes("$('goalText').textContent='Crie gás primordial'"),'primordial gas objective missing'],
            [engine.includes("return 'He + H → HeH⁺'"),'HeH formula missing'],
            [engine.includes("return 'HeH⁺ + H → H₂'"),'H2 formula missing'],
            [engine.includes("createPrimordialMolecule('HeH+'"),'bonded HeH mechanic missing'],
            [engine.includes("createPrimordialMolecule('H2'"),'bonded H2 mechanic missing'],
            [!engine.includes("createFreePiece('HeH+'"),'HeH incorrectly rendered as new piece'],
            [!engine.includes("createFreePiece('H2'"),'H2 incorrectly rendered as new piece'],
            [engine.includes("if(s.id==='first_atomic_bonds'){atom('H');atom('He')}"),'first phase starter invalid'],
            [engine.includes("createPrimordialMolecule('HeH+',he,hBond,{credit:false,silent:true})"),'second phase starter pair missing'],
            [engine.includes("const a=Math.random()*Math.PI*2;he.x=x+Math.cos(a)*74"),'helium release missing'],
            [css.includes('.atom[data-molecule]'),'molecular pair CSS missing'],
            [map.includes("flow(G.sequences.molecular,'molecular-primordial-flow')"),'molecular map flow missing'],
            [map.includes("addPath(byPhase(tail('atomic_li')),byPhase('first_atomic_bonds'),'primordial')"),'molecular map input connector missing'],
            [gen.includes("...seq('molecular')"),'molecular phases not in prologue'],
            [mode.includes('version:8'),'save version 8 missing'],
            [mode.includes("'first_atomic_bonds','first_nebulae'"),'save migration missing']
          ];
          for(const [ok,msg] of checks)if(!ok)throw new Error(msg);
          NODE
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js assets/css/ardua.css assets/js/campaign-graph.js assets/js/campaign-generations.js assets/js/campaign-map.js assets/js/campaign-mode.js
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "Adiciona primeiras moléculas ao Universo primordial"
            git push
          fi
