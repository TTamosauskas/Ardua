name: Patch instant discovery details

on:
  push:
    branches:
      - perf/instant-discovery-details

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/instant-discovery-details
          fetch-depth: 0

      - name: Apply optimized discovery detail patch
        run: python scripts/_patch_instant_discovery_details.py

      - name: Validate optimization
        run: |
          node --check assets/js/campaign-discoveries.js
          node --check assets/js/campaign-quarks-discoveries.js
          node --check assets/js/campaign-fundamental-forces.js
          node --check assets/js/campaign-discoveries-phenomena.js
          node --check assets/js/campaign-discoveries-elements.js
          node scripts/validate-instant-discovery-details.js
          node scripts/validate-fundamental-forces.js
          node scripts/validate-phenomena-discoveries.mjs
          node scripts/validate-menu-discoveries-ux.js
          node scripts/validate-discovery-inbox.js

      - name: Commit optimized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-instant-discovery-details.yml scripts/_patch_instant_discovery_details.py
          git add assets/js/campaign-discoveries.js assets/js/campaign-quarks-discoveries.js assets/js/campaign-fundamental-forces.js assets/js/campaign-discoveries-phenomena.js assets/js/campaign-discoveries-elements.js scripts/validate-instant-discovery-details.js
          git commit -m "Make discovery details local-first and instant"
          git push origin HEAD:perf/instant-discovery-details
