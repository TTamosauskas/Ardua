name: Test production element detail

on:
  push:
    branches: ["test/production-element-detail-20260910"]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/production-element-detail-20260910
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test deployed GitHub Pages
        run: node scripts/_production_element_detail_e2e.mjs
