name: Apply convection regression fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/apply-convection-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply convection runtime fix
        run: |
          python3 -m py_compile scripts/fix-convection-regression.py
          python3 scripts/fix-convection-regression.py

      - name: Validate engine and convection
        run: |
          node --check assets/js/ardua.js
          node scripts/validate-convection-regression.js
          node scripts/validate-coronal-jets.js
          node scripts/validate-stellar-plasma.js
          node scripts/validate-cumulative-recipes.js
          node scripts/validate-recipe-planner.js
          node scripts/validate-movement-chain-particles.js
          node scripts/validate-beta-parallel.js
          node scripts/validate-rotation-option.js
          node scripts/validate-recipe-audio-cadence.js
          node scripts/validate-campaign-phase-flow.js

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/ardua.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore stellar convection runtime"
          git push origin HEAD:main
