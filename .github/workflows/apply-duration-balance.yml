name: Apply progress and duration balance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-duration-balance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply deterministic engine migration
        run: python scripts/apply_duration_balance.py

      - name: Validate engine
        run: |
          node --check assets/js/ardua.js
          node tests/validate-static.js

      - name: Commit clean result
        run: |
          rm .github/workflows/apply-duration-balance.yml scripts/apply_duration_balance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/ardua.js .github/workflows/apply-duration-balance.yml scripts/apply_duration_balance.py
          git commit -m 'Balance phase duration and progress bar'
          git push
