name: Build generation architecture
on:
  push:
    branches: [feat/generation-architecture]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/generation-architecture
          fetch-depth: 0
      - name: Apply architecture patch
        run: node scripts/patch-generation-architecture.js
      - name: Validate JavaScript
        run: |
          node --check assets/js/campaign-generations.js
          node --check assets/js/campaign-generations-map.js
          node scripts/validate-cumulative-recipes.js
          grep -q 'campaign-generations.css' index.html
          grep -q 'campaign-generations.js' index.html
          grep -q 'campaign-generations-map.js' index.html
      - name: Commit generated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: integrate stellar generation architecture"
          git push origin HEAD:feat/generation-architecture
